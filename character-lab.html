<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#e8e9e7"/>
  <title>LifeSim — Character Lab (Meshy)</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#27332f;color-scheme:light}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9eae7}
    canvas{display:block;position:absolute;inset:0;width:100%;height:100%;touch-action:none}
    .panel{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;background:rgba(250,251,249,.94);border:1px solid #c8d5cd;border-radius:16px;box-shadow:0 8px 24px #34463b22;max-width:560px;padding:14px 16px;backdrop-filter:blur(12px)}
    h1{font-size:17px;margin:0 0 5px}p{font-size:12px;line-height:1.4;margin:4px 0 11px;color:#61716a}
    label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
    select,button,.file-button{font:inherit;font-size:13px;padding:10px 12px;border:1px solid #a9c1b4;border-radius:10px;background:#fff;color:#26362f;cursor:pointer}
    button:disabled,select:disabled{opacity:.45;cursor:not-allowed}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    select{max-width:100%;flex:1;min-width:130px}
    .file-button{display:inline-flex;background:#35795a;color:white;border-color:#35795a;font-weight:650}
    input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
    .status{font-size:12px;padding-top:11px;line-height:1.35;color:#394b43;overflow-wrap:anywhere}
    .help{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;font-size:12px;color:#3b5048;pointer-events:none;text-shadow:0 1px 2px #fff}
    @media(min-width:730px){.panel{right:auto;width:480px}}
  </style>
  <script type="importmap">{"imports":{"playcanvas":"https://cdn.jsdelivr.net/npm/playcanvas@2.24.1/build/playcanvas.mjs"}}</script>
</head>
<body>
  <canvas id="lab-canvas" aria-label="Сцена проверки 3D-персонажа"></canvas>
  <section class="panel" aria-label="Лаборатория персонажа">
    <h1>LifeSim · Meshy Character Lab</h1>
    <p>Сцена и управление создаются автоматически кодом. Файл GLB выбирается только если модель ещё не опубликована среди ассетов игры.</p>
    <div class="row">
      <label class="file-button" for="glb-input">Выбрать GLB</label>
      <input id="glb-input" type="file" accept=".glb,model/gltf-binary,application/octet-stream" aria-label="Выбрать GLB из Meshy" />
      <button id="reset-view" type="button">Сброс камеры</button>
    </div>
    <div style="margin-top:10px">
      <label for="clip-select">Анимация</label>
      <div class="row">
        <select id="clip-select" disabled><option>Сначала загрузите персонажа</option></select>
        <button id="pause-animation" type="button" disabled>Пауза</button>
      </div>
    </div>
    <div class="status" id="lab-status" role="status" aria-live="polite">Инициализация 3D…</div>
  </section>
  <div class="help">Одним пальцем — вращение · двумя — масштаб · все тесты модели отдельно от основной игры</div>
  <script type="module" src="./src/character-lab.js"></script>
</body>
</html>
