<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Блин’С · Animation Pilot</title><style>*{box-sizing:border-box}body{margin:0;background:#e1e8e2;font:14px system-ui;color:#243b34;overflow:hidden}canvas{position:absolute;width:100%;height:100%;touch-action:none}header{position:absolute;top:12px;left:12px;right:12px;padding:12px;border-radius:14px;background:#f9fbf5ed;display:flex;flex-wrap:wrap;gap:8px;align-items:center}h1{font-size:16px;margin:0;flex-basis:100%}button,select{font:inherit;min-height:44px;border:1px solid #879b90;background:white;border-radius:8px;padding:8px}#status{flex-basis:100%;font-size:12px}footer{position:absolute;bottom:12px;left:12px;right:12px;background:#f9fbf5ed;border-radius:12px;padding:12px}input{width:100%;height:34px}</style><canvas id="canvas"></canvas><header><h1>Animation Pilot · скамейка</h1><select id="profile"><option value="female">Женский</option><option value="male">Мужской</option></select><button id="play">Пауза</button><button id="angle">Ракурс</button><div id="status">Загрузка…</div></header><footer><label for="time">Сесть · отдых · встать</label><input id="time" type="range" min="0" max="1" step=".001" value="0"><div>Изолированный кандидат · художественная приёмка открыта</div></footer><script type="module">
import * as pc from './playcanvas.mjs';
const $=id=>document.getElementById(id);
const canvas=$('canvas'),app=new pc.Application(canvas,{graphicsDeviceOptions:{antialias:true,alpha:false,preserveDrawingBuffer:true}});
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.start();window.addEventListener('resize',()=>app.resizeCanvas());
app.scene.ambientLight=new pc.Color(.52,.55,.57);
const cam=new pc.Entity('Camera');cam.addComponent('camera',{clearColor:new pc.Color(.87,.90,.87),projection:pc.PROJECTION_ORTHOGRAPHIC,orthoHeight:1.65});app.root.addChild(cam);
const light=new pc.Entity('Key');light.addComponent('light',{type:'directional',color:new pc.Color(1,.94,.83),intensity:2});light.setEulerAngles(48,35,0);app.root.addChild(light);
const plane=new pc.Entity('Ground');plane.addComponent('render',{type:'plane'});plane.setLocalScale(12,1,12);const mat=new pc.StandardMaterial();mat.diffuse=new pc.Color(.58,.64,.58);mat.update();plane.render.material=mat;app.root.addChild(plane);
const report=await fetch('./report.json').then(r=>{if(!r.ok)throw Error('report');return r.json()});
let avatar,bench,assets=[],angle=0,playing=true,active;
const load=async name=>{const a=new pc.Asset(name,'container',{url:'./'+name+'.glb'});app.assets.add(a);assets.push(a);await new Promise((res,rej)=>{a.ready(res);a.once('error',rej);app.assets.load(a)});return a.resource};
function view(){const b=report.profiles[active].bench.origin;const offset=angle%3===0?[2,1.65,3]:angle%3===1?[3,1.3,0]:[0,1.7,-3];cam.setPosition(b[0]+offset[0],b[1]+offset[1],b[2]+offset[2]);cam.lookAt(b[0],b[1]+.85,b[2]);}
let busy=false;
async function profile(sex){if(busy)return;busy=true;$('profile').disabled=true;try{if(avatar)avatar.destroy();if(bench)bench.destroy();for(const a of assets){app.assets.remove(a);a.unload()}assets=[];active=sex;const info=report.profiles[sex],a=await load(sex),f=await load('bench');avatar=a.instantiateRenderEntity();bench=f.instantiateRenderEntity();app.root.addChild(avatar);app.root.addChild(bench);bench.setPosition(...info.bench.origin);bench.setEulerAngles(0,info.bench.yaw,0);plane.setPosition(0,info.bench.origin[1]-.005,0);avatar.addComponent('anim',{activate:true});const tracks=a.animations.map(x=>x.resource);if(tracks.length!==1)throw Error('expected one baked timeline');const track=tracks[0];avatar.anim.assignAnimation(track.name,track,undefined,1,false);avatar.anim.baseLayer.play(track.name);avatar.anim.playing=true;avatar.anim.speed=playing?1:0;view();$('status').textContent='Готово · '+info.frames+' кадров · '+track.name;window.pilot={seek(u){avatar.anim.playing=true;avatar.anim.speed=0;avatar.anim.baseLayer.activeStateCurrentTime=u*track.duration;},probe(){return {webgl:!!app.graphicsDevice.gl,meshCount:avatar.findComponents('render').reduce((n,c)=>n+c.meshInstances.length,0),bones:collect(avatar),time:avatar.anim.baseLayer.activeStateCurrentTime,duration:track.duration}}};}finally{busy=false;$('profile').disabled=false}}
function collect(e){const out={};function walk(n){if(n.children.length||n.name)out[n.name]=n.getPosition().toArray();for(const c of n.children)walk(c)}walk(e);return out}
$('profile').onchange=e=>profile(e.target.value).catch(err=>$('status').textContent=String(err));$('angle').onclick=()=>{angle++;view()};$('play').onclick=()=>{playing=!playing;if(playing&&avatar.anim.baseLayer.activeStateCurrentTime>=avatar.anim.baseLayer.activeStateDuration-.03)avatar.anim.baseLayer.activeStateCurrentTime=0;avatar.anim.playing=true;avatar.anim.speed=playing?1:0;$('play').textContent=playing?'Пауза':'Продолжить'};$('time').oninput=e=>{playing=false;$('play').textContent='Продолжить';window.pilot.seek(+e.target.value)};
app.on('update',()=>{if(playing&&window.pilot){const layer=avatar.anim.baseLayer;$('time').value=Math.min(1,layer.activeStateCurrentTime/layer.activeStateDuration)}});await profile('female');
</script></html>
