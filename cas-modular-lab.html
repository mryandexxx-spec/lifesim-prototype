<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dfeae5">
<title>Блин’С · CAS-02.1-C — мобильный 3D-просмотр</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e2ebe7;font:14px system-ui,-apple-system,sans-serif;color:#223b31}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.topline{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:9px;pointer-events:none}
.topline strong{font-size:13px;background:#f7fbf9e8;border-radius:11px;padding:9px 12px;box-shadow:0 3px 12px #142e2220}
.topline span{font-size:11px;background:#223c31d8;color:#fff;border-radius:9px;padding:7px 9px}
.panel{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:10px;right:10px;max-width:480px;margin:auto;padding:12px 12px 10px;background:#fafffbea;border:1px solid #b6cbc0;border-radius:17px;box-shadow:0 8px 24px #1b382828;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-height:45dvh;overflow-y:auto;overscroll-behavior:contain}
h1{font-size:14px;margin:0 0 7px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.row>*{min-width:0}
button,select{font:inherit;font-size:13px;min-height:44px;border-radius:10px;border:1px solid #a9c3b5;background:#fff;padding:8px 10px;color:#203b2d}
button{cursor:pointer;touch-action:manipulation}
button[aria-pressed="true"]{background:#326a51;color:white;border-color:#326a51}
button:disabled,select:disabled{opacity:.55}
#clip-select{flex:1}
.slot-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:7px}
.slot-row button{font-size:12px;padding:7px 3px;white-space:nowrap}
#lab-status{font-size:11px;line-height:1.3;color:#506758;margin-top:8px;max-height:2.6em;overflow:hidden}
.metrics{display:flex;align-items:center;gap:7px;justify-content:space-between;font-size:11px;margin-top:6px;color:#536b5e}
#lab-asset-info{max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lab-fps{white-space:nowrap}
#show-lab-report{min-height:38px;padding:6px 10px;font-size:12px}
#lab-report[hidden]{display:none}
#lab-report-text{width:100%;height:100px;font:11px ui-monospace,monospace}
#glb-input{display:none}
@media(max-height:640px){.panel{padding:9px 10px 7px}h1{font-size:13px;margin:0 0 3px}.row{margin-top:5px}.slot-row{margin-top:5px}#lab-status{font-size:10px;margin-top:5px}.metrics{margin-top:3px}}
</style>
<script type="importmap">{"imports":{"playcanvas":"./vendor/playcanvas.mjs"}}</script>
</head><body data-character="casproto">
<canvas id="lab-canvas" aria-label="Полнофигурный 3D-просмотр персонажа"></canvas>
<header class="topline" aria-label="Лаборатория"><strong>Блин’С · CAS-02.1</strong><span>Прототип · не в игре</span></header>
<section class="panel" id="cas-lab-panel" aria-label="Панель управления модульным персонажем">
<h1>Внешность и анимация</h1>
<div class="slot-row" aria-label="Сменная геометрия">
<button type="button" data-cas-slot="hair" aria-pressed="false">Волосы B</button>
<button type="button" data-cas-slot="top" aria-pressed="false">Верх B</button>
<button type="button" data-cas-slot="trousers" aria-pressed="false">Низ B</button>
<button type="button" data-cas-slot="shoes" aria-pressed="false">Обувь B</button>
</div>
<div class="row"><select id="clip-select" disabled aria-label="Анимация"><option>Загрузка…</option></select>
<button id="pause-animation" type="button" disabled>Пауза</button><button id="reset-view" type="button">Камера</button></div>
<div id="lab-status" role="status" aria-live="polite">Загрузка PlayCanvas…</div>
<div class="metrics"><span id="lab-fps">FPS: …</span><span id="lab-asset-info">GLB…</span><button id="show-lab-report" type="button">Отчёт</button></div>
<div id="lab-report" hidden><textarea id="lab-report-text" readonly aria-label="Технические данные"></textarea></div>
<input id="glb-input" type="file" accept=".glb">
</section>
<script type="module" src="./src/character-lab.js"></script>
</body></html>
