name: Q0 — mobile WebGL viewport health and recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewport-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node modules and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Pure state diagnostics, syntax and full unit regression
        run: |
          node --check src/game.js
          node --check src/viewport-health.js
          node --check tests/q0-viewport-browser-smoke.mjs
          node --test tests/viewport-health.test.js
          npm test
      - name: Real Chromium WebGL and touch-size recovery smoke
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/q0-viewport-http.log 2>&1 &
          sleep 3
          node tests/q0-viewport-browser-smoke.mjs
      - name: Keep diagnostic view screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q0-viewport-screens
          path: q0-viewport-*.png
          if-no-files-found: ignore
