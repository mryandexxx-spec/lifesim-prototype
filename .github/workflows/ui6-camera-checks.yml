name: UI6 touch camera and no accidental interaction checks (no deploy)
on:
  push:
    branches: [feature/ui6-camera-gestures-20261115]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: |
          node --check src/game.js
          node --check src/camera-controls.js
          node --check src/camera-gestures.js
          node --check src/insight-presentation.js
          node --check src/required-choice-focus.js
      - name: Verify optimized original GLB models
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
