name: F4b6 quality preflight
on:
  push:
    branches: [feature/f4b6-quality-profiles-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
      - run: node --check src/object-quality-presentation.js && node --check src/game.js
