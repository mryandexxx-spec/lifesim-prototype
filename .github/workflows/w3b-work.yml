name: W3-B — work modes, needs and mobile PlayCanvas QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  work-needs:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlayCanvas and real Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Work needs pure rules, source syntax and full Node regression
        run: |
          node --check src/career-work-needs.js
          node --check src/career-state.js
          node --check src/career-work.js
          node --check src/career-progression.js
          node --check src/household.js
          node --check src/career-phone-ui.js
          node --check src/career-shift-summary-ui.js
          node --check tests/w3b-browser-smoke.mjs
          node --test tests/w3b-work-needs.test.js
          npm test
      - name: Genuine four-viewport PlayCanvas/WebGL touch and reload
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w3b-http.log 2>&1 &
          sleep 3
          node tests/w3b-browser-smoke.mjs
      - name: Publish device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3b-mobile-webgl-screenshots
          path: w3b-work-*.png
          if-no-files-found: ignore
