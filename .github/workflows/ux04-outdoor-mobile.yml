name: UX-04 — mobile lot palette and garden card
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux04:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and validate unit contracts
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node --check src/game.js
          node --check src/outdoor-ux04.js
          node --check tests/ux04-browser-smoke.mjs
          npm test
      - name: PlayCanvas WebGL four-viewport lot and garden smoke
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux04.log 2>&1 &
          sleep 3
          node tests/ux04-browser-smoke.mjs
      - name: Mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux04-lot-garden-four-sizes
          path: ux04-artifacts/
          if-no-files-found: ignore
