name: LOT-D1b — freeform pool economy, fixtures and safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pool-editor-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate D1b modules and full legacy regression
        run: |
          npm ci
          node --check src/pool-equipment.js
          node --check src/pool-editor.js
          node --check src/lot-surface.js
          node --check src/outdoor-proposals.js
          node --test tests/lot-d1a.test.js tests/lot-d1b.test.js
          npm test
      - name: Verify Pages contains pool-editor dependencies
        run: |
          grep -F 'cp src/pool-topology.js site/src/' .github/workflows/pages.yml
          grep -F 'cp src/pool-equipment.js src/pool-editor.js site/src/' .github/workflows/pages.yml
