name: H4 skill progression and unlocked literature regression
on:
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check H4 syntax
        run: |
          node --check src/skill-presentation.js
          node --check src/hobby-reading.js
          node --check src/household.js
          node --check src/game.js
          node --check tests/hobbies-h4.test.js
      - name: Install pinned test dependencies
        run: npm ci --ignore-scripts
      - name: Full compatibility suite
        run: npm test
