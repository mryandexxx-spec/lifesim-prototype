name: CF-ANIM production pilot
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      browser_only:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  native-bench-pilot:
    if: ${{ !inputs.browser_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MUJOCO_GL: disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6974fc7e91ee2b089bde79c701eee946da142b51
          path: frozen-fbik
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9a4d8adaccbf55572346904750e252565d30d924
          path: prior-code
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cf-body-d-tools-full-rig
          run-id: 45681068614
          github-token: ${{ github.token }}
          path: prior-full
      - uses: actions/download-artifact@v4
        with:
          name: cf-anim-tools-evidence
          run-id: 45703401365
          github-token: ${{ github.token }}
          path: prior-tools
      - uses: actions/download-artifact@v4
        with:
          name: cf-anim-contacts-evidence
          run-id: 45711417970
          github-token: ${{ github.token }}
          path: prior-contacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated pinned direct dependencies
        run: |
          mkdir -p fbik-out
          python -m py_compile tools/cf_anim_pilot.py frozen-fbik/tools/cf_anim_fbik.py
          python -m pip install --only-binary=:all: bpy==4.5.0 numpy==1.26.4 imageio-ffmpeg==0.6.0 mink==0.0.13 mujoco==3.3.6 daqp==0.7.2 qpsolvers==4.11.0 scipy==1.17.1 osqp==1.0.4 clarabel==0.11.1
          python -m pip inspect > fbik-out/dependency-inspect.json
          python -m pip freeze > fbik-out/dependency-freeze.txt
          # pip can reject the bpy wheel tag even after installing it on Linux.
          # Only that exact metadata diagnostic may be superseded by actual runtime checks.
          python - <<'PY'
          import subprocess, sys, pathlib
          p = subprocess.run([sys.executable, "-m", "pip", "check"], capture_output=True, text=True)
          log = p.stdout + p.stderr
          print(log)
          pathlib.Path("fbik-out/pip-check.txt").write_text(log)
          if p.returncode:
              assert log.strip() == "bpy 4.5.0 is not supported on this platform", log
          import bpy, numpy, mujoco, mink, qpsolvers, importlib.metadata as md
          assert bpy.app.version == (4, 5, 0)
          assert md.version("mink") == "0.0.13" and mujoco.__version__ == "3.3.6"
          assert "daqp" in qpsolvers.available_solvers
          model = mujoco.MjModel.from_xml_string('<mujoco><worldbody><body><joint type="hinge"/><geom size=".1"/></body></worldbody></mujoco>')
          config = mink.Configuration(model)
          assert len(config.q) == 1
          task = mink.PostureTask(model, cost=1.)
          task.set_target_from_configuration(config)
          velocity = mink.solve_ik(config, [task], .05, "daqp", damping=.001)
          assert numpy.isfinite(velocity).all() and numpy.linalg.norm(velocity) < 1e-6
          config.integrate_inplace(velocity, .05)
          bpy.ops.wm.read_factory_settings(use_empty=True)
          print("Blender and Mink native runtime preflight PASS")
          PY
      - name: Native bench contact, offline trajectory and baked GLB
        id: native
        run: python tools/cf_anim_pilot.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real PlayCanvas playback on Chromium and WebKit
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          cp node_modules/playcanvas/build/playcanvas.mjs pilot-out/playcanvas.mjs
          cp tools/cf-anim-pilot-lab.html pilot-out/lab.html
          python -m http.server 8765 --bind 127.0.0.1 --directory pilot-out >/tmp/pilot-http.log 2>&1 &
          sleep 2
          xvfb-run -a node tools/cf-anim-pilot-browser.mjs
      - name: Independent GLB reimport joint replay gate
        if: ${{ always() && steps.native.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          r=json.load(open('pilot-out/report.json'))
          assert len(r['profiles'])==2
          assert all(p['export_reimport']['within_2mm'] for p in r['profiles'].values()), {s:p['export_reimport'] for s,p in r['profiles'].items()}
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-anim-pilot-evidence
          path: |
            pilot-out/
            fbik-out/
          if-no-files-found: warn

  browser-replay-r3:
    if: ${{ inputs.browser_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '15117711405'
          run-id: 45815763571
          github-token: ${{ github.token }}
          path: replay-r3
      - name: Verify exact previously generated GLB and report bytes
        run: |
          mkdir -p pilot-out
          cp replay-r3/pilot-out/{female.glb,male.glb,bench.glb,report.json} pilot-out/
          cd pilot-out
          sha256sum -c <<'EOF'
          65a2e98db27caa029f87b8520509bd992d391b220c00cfbc2284f781bb995b17  female.glb
          37dc88e16e452195810848ad0e6b8a06a723a9e0e8d0c3abe6a83651a5aff0a6  male.glb
          eb4407b9e6abc3ad42568f90e3a5d9242845dd7af81fa7f84714aeb4de7cd30b  bench.glb
          cc929e71f2de68f4ba44fe437dcee4d4ce9630f4fb71a353d583cc3bbf2b7b0b  report.json
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser-only replay with real pixel gate
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          cp node_modules/playcanvas/build/playcanvas.mjs pilot-out/playcanvas.mjs
          cp tools/cf-anim-pilot-lab.html pilot-out/lab.html
          python -m http.server 8765 --bind 127.0.0.1 --directory pilot-out >/tmp/pilot-http.log 2>&1 &
          sleep 2
          xvfb-run -a node tools/cf-anim-pilot-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-anim-pilot-browser-replay-r3
          path: pilot-out/
          if-no-files-found: warn
