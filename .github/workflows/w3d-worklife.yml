name: W3-D — native work-life emotion and mobile QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  work-life:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install node dependencies and real Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate W3-D contracts and full regression
        run: |
          node --check src/career-worklife.js
          node --check src/career-worklife-conflict.js
          node --check src/career-work.js
          node --check src/psychology.js
          node --check src/emotion-engine.js
          node --check src/career-phone-ui.js
          node --check src/career-shift-summary-ui.js
          node --check src/game.js
          node --check tests/w3d-browser-smoke.mjs
          node --test tests/w3d-worklife.test.js
          npm test
      - name: Genuine PlayCanvas WebGL four mobile viewports
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w3d-http.log 2>&1 &
          sleep 3
          node tests/w3d-browser-smoke.mjs
      - name: Publish W3-D mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3d-mobile-webgl-screenshots
          path: w3d-*.png
          if-no-files-found: ignore
