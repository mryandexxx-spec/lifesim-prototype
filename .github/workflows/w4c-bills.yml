name: W4-C — household bills, payment and mobile WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  household-bills:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies and real Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Pure bills, migration, ledger and all regression tests
        run: |
          node --check src/household-bills.js
          node --check src/household.js
          node --check src/finance-ledger.js
          node --check src/finance-presentation.js
          node --check src/finance-phone-ui.js
          node --check src/career-phone-ui.js
          node --check src/game.js
          node --check tests/w4c-bills-browser-smoke.mjs
          node --test tests/w4c-bills.test.js
          npm test
      - name: Real PlayCanvas touch and W4-C payment on four viewports
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w4c-bills.log 2>&1 &
          sleep 3
          node tests/w4c-bills-browser-smoke.mjs
      - name: Upload iPhone viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4c-bills-mobile-webgl-screens
          path: w4c-bills-*.png
          if-no-files-found: ignore
