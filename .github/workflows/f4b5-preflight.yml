name: F4b5 object effects preflight
on:
  push:
    branches: [feature/f4b5-effect-hardening-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm test
      - run: node --check src/object-effect-engine.js && node --check src/object-use-runtime.js && node --check src/game.js
