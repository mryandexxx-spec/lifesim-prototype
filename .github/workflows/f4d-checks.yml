name: F4D seat and expanded-room regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  f4d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Verify F4D touched modules syntax
        run: |
          node --check src/seat-furniture.js
          node --check src/game.js
          node --check src/furniture-transform.js
          node --check src/furniture-catalog.js
          node --check src/simulation.js
          node --check src/household.js
          node --check src/navigation.js
          node --check src/camera-controls.js
          node --check src/furniture-layout.js
          node --check src/furniture-shop.js
      - name: Run complete regression
        run: npm test
