name: F4C + H2 combined shop and music full regression
on:
  push:
    branches: [feature/f4c-full-furniture-on-h2-20261116]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: |
          node --check src/game.js
          node --check src/furniture-procedural-library.js
          node --check src/furniture-catalog.js
          node --check src/furniture-products.js
          node --check src/object-legacy-adapter.js
          node --check src/shop-catalog-selector.js
          node --check src/reading-journey.js
      - run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
