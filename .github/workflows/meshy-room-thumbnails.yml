name: Generate 15 real Meshy furniture catalog thumbnails
on:
  push:
    branches: [fix/meshy-starter-and-catalog-20261120]
    paths: [.github/workflows/meshy-room-thumbnails.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser and pinned PlayCanvas
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
      - name: Render from the actual normalized GLB, not procedural SVG
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/meshy-thumbnails.log 2>&1 &
          sleep 3
          node tests/meshy-room-thumbnail-generator.mjs
      - name: Commit all real 3D thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test "$(find assets/furniture/meshy-room-v1/thumbnails -name '*.png' | wc -l)" -eq 15
          git add assets/furniture/meshy-room-v1/thumbnails/*.png
          git diff --cached --check
          git commit -m "assets(meshy): add 15 true-GLB catalog renders"
          git push origin HEAD:fix/meshy-starter-and-catalog-20261120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meshy-real-3d-catalog-thumbnails
          path: assets/furniture/meshy-room-v1/thumbnails/
          if-no-files-found: ignore
