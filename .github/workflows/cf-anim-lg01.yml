name: LG-01 source ports
on:
  pull_request:
    branches: ['diagnostic/cf-anim-mocap-transitions']
permissions:
  contents: read
jobs:
  cf-anim-lg01:
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnostic/cf-anim-lg01-source-ports' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Fetch exact accepted loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15182669957/zip" -o loop.zip
          echo '62376b4ec61cf3fe7f4f56d5088678f8ffbdfa21d3a512b44ef053c00d8a3172  loop.zip' | sha256sum -c
          unzip -q loop.zip -d input-loop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native captured-transition discovery and fixed endpoint screen
        run: |
          python -m pip install --only-binary=:all: numpy==1.26.4 scipy==1.17.1 Pillow==11.3.0
          python -m py_compile tools/cf_anim_lg01.py
          timeout 300s python -u tools/cf_anim_lg01.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-anim-lg01-evidence
          path: artifacts/cf-anim-lg01/
          if-no-files-found: warn

