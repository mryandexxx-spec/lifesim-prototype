name: F4b0 object architecture preflight
on:
  push:
    branches: [feature/f4b0-extensible-objects-20261116]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression and headless object system
        run: |
          npm ci
          npm test
          node --check src/object-definition-registry.js
          node --check src/object-effect-engine.js
          node --check src/object-legacy-adapter.js
          node --check src/game.js
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
