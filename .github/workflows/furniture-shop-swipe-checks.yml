name: F2 shop finger-aligned placement checks
on:
  push:
    branches: [fix/f2-swipe-moves-item-20261116]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Full tests, source syntax and mobile GLB hashes
        run: |
          npm ci
          npm test
          node --check src/game.js
          node --check src/camera-controls.js
          node --check src/camera-gestures.js
          node --check src/furniture-placement-preview.js
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
