name: R1a paired hug checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-romantic-hug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integration tests
        run: |
          npm ci
          npm test
          node --check src/game.js
          node --check src/romance.js
          node --check src/relationships.js
          node --check src/romantic-hug.js
          node --check src/meshy-hug-runtime.js
          node --check src/meshy-visual.js
          node --check src/meshy-mira-visual.js
      - name: Confirm existing Meshy GLBs unchanged
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
