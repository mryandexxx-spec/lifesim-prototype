name: LIFE HUD-R1 — six need trends, 4 mobile WebGL viewports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hud-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check HUD-R1 logic and whole Node regression
        run: |
          npm ci
          node --check src/need-trends.js
          node --check src/game.js
          node --test tests/hud-r1-trends.test.js
          npm test
      - name: Install mobile Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Four iPhone-size live PlayCanvas, needs, switch and pause
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/hud-r1-http.log 2>&1 &
          sleep 3
          node tests/hud-r1-browser-smoke.mjs
          node tests/ux09-browser-smoke.mjs
