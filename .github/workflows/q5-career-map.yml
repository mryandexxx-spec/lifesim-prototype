name: Q5 interactive career map — six jobs and four mobile WebGL viewports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q5-career-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install production runtime and headless mobile browser
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Six careers, twelve paths, eight levels, legacy saves and full Node regression
        run: |
          node --check src/career-map.js
          node --check src/career-map-ui.js
          node --check src/career-phone-ui.js
          node --check tests/q5-career-map.test.js
          node --check tests/q5-browser-smoke.mjs
          node --test tests/q5-career-map.test.js
          npm test
      - name: Real PlayCanvas WebGL, mobile touch and VoiceOver DOM at four sizes
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/q5-http.log 2>&1 &
          sleep 2
          node tests/q5-browser-smoke.mjs
