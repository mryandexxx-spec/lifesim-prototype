name: LIFE CAM-R1 — responsive two-finger orbit and twist
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Node regression and strict camera gesture contracts
        run: |
          npm ci
          node --check src/camera-gestures.js
          node --check tests/life-cam-r1.test.js
          node --test tests/camera-gestures.test.js tests/camera-controls.test.js tests/life-cam-r1.test.js
          npm test
      - name: Install real Chromium for PlayCanvas WebGL validation
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Four mobile-size real canvas / touch / save regression
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/life-cam-r1-server.log 2>&1 &
          sleep 3
          node tests/camera-twist-browser.mjs
          node tests/ux09-browser-smoke.mjs
      - name: Preserve actual four-size WebGL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-cam-r1-ux09-webgl
          path: ux09-artifacts/
          if-no-files-found: ignore
