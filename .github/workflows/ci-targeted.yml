name: CI — change-aware Node and one-screen WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      browser: ${{ steps.impact.outputs.browser }}
      parcel_editor: ${{ steps.impact.outputs.parcel_editor }}
      cas_inventory: ${{ steps.impact.outputs.cas_inventory }}
      cas_baseline: ${{ steps.impact.outputs.cas_baseline }}
      cas_hud: ${{ steps.impact.outputs.cas_hud }}
      cas_soak: ${{ steps.impact.outputs.cas_soak }}
      cas_modular: ${{ steps.impact.outputs.cas_modular }}
      cas_alex: ${{ steps.impact.outputs.cas_alex }}
      cas_styles: ${{ steps.impact.outputs.cas_styles }}
      cas_cc0: ${{ steps.impact.outputs.cas_cc0 }}
      e5: ${{ steps.impact.outputs.e5 }}
      fixture_motion: ${{ steps.impact.outputs.fixture_motion }}
      integration_qa: ${{ steps.impact.outputs.integration_qa }}
      micro_ux: ${{ steps.impact.outputs.micro_ux }}
      load_truth: ${{ steps.impact.outputs.load_truth }}
      fridge_ux: ${{ steps.impact.outputs.fridge_ux }}
      grill_r1: ${{ steps.impact.outputs.grill_r1 }}
      career_shifts: ${{ steps.impact.outputs.career_shifts }}
      phone_platform: ${{ steps.impact.outputs.phone_platform }}
      fandom_tv: ${{ steps.impact.outputs.fandom_tv }}
      fandom_phone: ${{ steps.impact.outputs.fandom_phone }}
      fandom_r2a: ${{ steps.impact.outputs.fandom_r2a }}
      fandom_r2b: ${{ steps.impact.outputs.fandom_r2b }}
      fandom_r2c: ${{ steps.impact.outputs.fandom_r2c }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prevent automatic historical workflow fan-out
        run: node scripts/ci-guard.mjs
      - name: Syntax and dependency-aware affected Node tests
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-target.mjs
      - name: Archive CAS-01.8 Node eight-day soak report
        if: ${{ always() && steps.impact.outputs.cas_soak == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-01-8-node-pr
          path: artifacts/cas-01-8/node.json
          if-no-files-found: ignore
      - name: CAS-00 full-src resident dependency inventory (not a four-person simulation)
        if: ${{ steps.impact.outputs.cas_inventory == 'true' }}
        run: node scripts/cas-00-dependency-inventory.mjs
      - name: Archive CAS-00 complete source lexical inventory
        if: ${{ always() && steps.impact.outputs.cas_inventory == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-00-source-inventory
          path: artifacts/cas-00/resident-dependency-inventory.json
          if-no-files-found: error
  mobile-webgl-smoke:
    needs: targeted
    if: ${{ needs.targeted.outputs.browser == 'true' || needs.targeted.outputs.cas_cc0 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium only when browser-facing code changed
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Real PlayCanvas startup at one iPhone viewport
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ci-target-http.log 2>&1 &
          sleep 3
          node tests/ci-browser-boot.mjs
      - name: CAS-01.7 actual 4-resident iPhone viewport WebGL/HUD/career
        if: ${{ needs.targeted.outputs.cas_hud == 'true' }}
        run: node tests/cas-01-7-browser-smoke.mjs
      - name: Upload CAS-01.7 mobile screenshots
        if: ${{ always() && needs.targeted.outputs.cas_hud == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-01-7-mobile-pr
          path: artifacts/cas-01-7/
          if-no-files-found: ignore
      - name: CAS-02.1-B original skinned interchangeable GLB and pose real mobile browser
        if: ${{ needs.targeted.outputs.cas_modular == 'true' }}
        run: |
          node scripts/build-cas-modular-mannequin.mjs
          node tests/cas-02-1-b-browser-smoke.mjs
      - name: Archive CAS-02.1-B real skinned model visual evidence
        if: ${{ always() && needs.targeted.outputs.cas_modular == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-02-1-b-mobile-pr
          path: artifacts/cas-02-1-b/
          if-no-files-found: error
      - name: CAS-02.1-D genuine Alex shoe skin split and real mobile WebGL
        if: ${{ needs.targeted.outputs.cas_alex == 'true' }}
        run: |
          node scripts/build-cas-alex-wardrobe.mjs
          node tests/cas-02-1-d-browser-smoke.mjs
      - name: Archive CAS-02.1-D Alex and original/alternative footwear screenshots
        if: ${{ always() && needs.targeted.outputs.cas_alex == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-02-1-d-real-alex-pr
          path: artifacts/cas-02-1-d/
          if-no-files-found: error
      - name: CAS-02.1-E real Alex and Mira independently skinned footwear in four mobile WebGL previews
        if: ${{ needs.targeted.outputs.cas_styles == 'true' }}
        run: |
          node scripts/build-cas-resident-footwear-v2.mjs
          node tests/cas-02-1-e-browser-smoke.mjs
      - name: Archive CAS-02.1-E real resident source-shoe screenshots and measured WebGL
        if: ${{ always() && needs.targeted.outputs.cas_styles == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-02-1-e-real-resident-footwear-pr
          path: artifacts/cas-02-1-e/
          if-no-files-found: error
      - name: CAS-02.1-F0 retrieve actual 3 CC0 source GLBs and license manifests
        if: ${{ needs.targeted.outputs.cas_cc0 == 'true' }}
        run: |
          node scripts/build-cas-resident-footwear-v2.mjs
          node scripts/cas-02-1-f0-download-assets.mjs
          node scripts/cas-02-1-f1-split-dress.mjs
          node scripts/cas-02-1-f1-alex-underfoot.mjs
          node tests/cas-02-1-f0-browser-smoke.mjs
          node tests/cas-02-1-f1-browser-smoke.mjs
      - name: Archive CAS-02.1-F0 actual GLB/CC0 license and source verification
        if: ${{ always() && needs.targeted.outputs.cas_cc0 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-02-1-f0-licensed-source-audit
          path: |
            assets/characters/cas-cc0-f0/*.audit.json
            assets/characters/cas-cc0-f0/*.origin.json
            assets/characters/cas-cc0-f0/*.license.txt
            assets/characters/cas-cc0-f0/index.json
            assets/characters/cas-cc0-f1/dress.manifest.json
            assets/characters/cas-alex-cc0-fitting-base.json
            artifacts/cas-02-1-f0/
            artifacts/cas-02-1-f1/
          if-no-files-found: error
      - name: CAS-01.8 actual 2/4 resident mobile-size WebGL performance and save soak
        if: ${{ needs.targeted.outputs.cas_soak == 'true' }}
        run: node tests/cas-01-8-browser-smoke.mjs
      - name: Upload CAS-01.8 stress reports and mobile WebGL screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-01-8-soak-pr
          path: artifacts/cas-01-8/
          if-no-files-found: ignore
      - name: Parcel editor real scene and transaction checks
        if: ${{ needs.targeted.outputs.parcel_editor == 'true' }}
        run: node tests/parcel-editor-browser.mjs
      - name: BUILD-UX real PlayCanvas mobile screenshots
        if: ${{ always() && needs.targeted.outputs.parcel_editor == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: build-ux-mobile-pr
          path: artifacts/parcel-editor/
          if-no-files-found: ignore
      - name: MICRO-UX-R1 touch/menu and queue smoke at two mobile viewports
        if: ${{ needs.targeted.outputs.micro_ux == 'true' }}
        run: node tests/micro-ux-r1-browser-smoke.mjs
      - name: LOAD-TRUTH-R1 factual stages at two mobile WebGL viewports
        if: ${{ needs.targeted.outputs.load_truth == 'true' }}
        run: node tests/load-truth-r1-browser-smoke.mjs
      - name: FRIDGE-UX-R2 approved A actual two-viewport PlayCanvas and HUD smoke
        if: ${{ needs.targeted.outputs.fridge_ux == 'true' }}
        run: node tests/fridge-ux-r2-browser-smoke.mjs
      - name: GRILL-R1 dual-viewport PlayCanvas, paid meat/chicken and outdoor game smoke
        if: ${{ needs.targeted.outputs.grill_r1 == 'true' }}
        run: node tests/grill-r1-browser-smoke.mjs
      - name: Upload GRILL-R1 mobile gameplay snapshots
        if: ${{ always() && needs.targeted.outputs.grill_r1 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: grill-r1-mobile-pr
          path: artifacts/grill-r1/
          if-no-files-found: ignore
      - name: CAREER-SHIFTS-R1 approved rank schedules, overnight calendar and phone in real two-size WebGL
        if: ${{ needs.targeted.outputs.career_shifts == 'true' }}
        run: node tests/career-shifts-r1-browser-smoke.mjs
      - name: Upload CAREER-SHIFTS-R1 mobile evidence
        if: ${{ always() && needs.targeted.outputs.career_shifts == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: career-shifts-r1-mobile-pr
          path: artifacts/career-shifts-r1/
          if-no-files-found: ignore
      - name: PHONE-PLATFORM-R1 real in-game phone home and calls at two mobile WebGL viewports
        if: ${{ needs.targeted.outputs.phone_platform == 'true' }}
        run: node tests/phone-platform-r1-browser-smoke.mjs
      - name: Upload PHONE-PLATFORM-R1 browser screenshots for visual QA
        if: ${{ always() && needs.targeted.outputs.phone_platform == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: phone-platform-r1-mobile-pr
          path: artifacts/phone-platform-r1/
          if-no-files-found: ignore
      - name: FANDOM-R1-C real two-viewport football TV and calendar smoke
        if: ${{ needs.targeted.outputs.fandom_tv == 'true' }}
        run: node tests/fandom-r1-c-browser-smoke.mjs
      - name: Upload FANDOM-R1-C screenshots
        if: ${{ always() && needs.targeted.outputs.fandom_tv == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fandom-r1-c-mobile-pr
          path: artifacts/fandom-r1-c/
          if-no-files-found: ignore
      - name: FANDOM-R1-D fifth-app real phone, football state and v1 reload
        if: ${{ needs.targeted.outputs.fandom_phone == 'true' }}
        run: node tests/fandom-r1-d-browser-smoke.mjs
      - name: Upload FANDOM-R1-D mobile phone screenshots
        if: ${{ always() && needs.targeted.outputs.fandom_phone == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fandom-r1-d-mobile-pr
          path: artifacts/fandom-r1-d/
          if-no-files-found: ignore
      - name: FANDOM-R2-A direct mobile game-clock stream on two real viewports
        if: ${{ needs.targeted.outputs.fandom_r2a == 'true' }}
        run: node tests/fandom-r2-a-browser-smoke.mjs
      - name: Upload FANDOM-R2-A actual phone screenshots
        if: ${{ always() && needs.targeted.outputs.fandom_r2a == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fandom-r2-a-mobile-pr
          path: artifacts/fandom-r2-a/
          if-no-files-found: ignore
      - name: FANDOM-R2-B real mobile bought fan decor and crests
        if: ${{ needs.targeted.outputs.fandom_r2b == 'true' }}
        run: node tests/fandom-r2-b-browser-smoke.mjs
      - name: Upload FANDOM-R2-B screenshots
        if: ${{ always() && needs.targeted.outputs.fandom_r2b == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fandom-r2-b-mobile-pr
          path: artifacts/fandom-r2-b/
          if-no-files-found: ignore
      - name: FANDOM-R2-C real mobile joint football viewing and saved receipts
        if: ${{ needs.targeted.outputs.fandom_r2c == 'true' }}
        run: node tests/fandom-r2-c-browser-smoke.mjs
      - name: Upload FANDOM-R2-C screenshots
        if: ${{ always() && needs.targeted.outputs.fandom_r2c == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: fandom-r2-c-mobile-pr
          path: artifacts/fandom-r2-c/
          if-no-files-found: ignore
      - name: Imported fixtures and outdoor character motion at mobile viewport
        if: ${{ needs.targeted.outputs.fixture_motion == 'true' }}
        run: node tests/fixture-motion-browser-smoke.mjs
      - name: CAS-00 real two-resident WebGL baseline across four mobile viewports and warm reload
        if: ${{ needs.targeted.outputs.cas_baseline == 'true' }}
        run: node tests/cas-00-browser-baseline.mjs
      - name: Preserve CAS-00 two-resident performance report and real mobile frames
        if: ${{ always() && needs.targeted.outputs.cas_baseline == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-00-mobile-baseline
          path: artifacts/cas-00/
          if-no-files-found: ignore
      - name: LOT-E5 full four-viewport cross-mode release QA (only when E5 changes)
        if: ${{ needs.targeted.outputs.e5 == 'true' }}
        run: node tests/lot-e5-browser-smoke.mjs
      - name: Upload LOT-E5 cross-mode release evidence
        if: ${{ always() && needs.targeted.outputs.e5 == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lot-e5-cross-mode-pr
          path: artifacts/lot-e5/
          if-no-files-found: ignore
      - name: P4 four-viewport life systems integration QA (only when P4 browser changes)
        if: ${{ needs.targeted.outputs.integration_qa == 'true' }}
        run: node tests/life-integration-qa-browser.mjs
      - name: Upload P4 integration evidence
        if: ${{ always() && needs.targeted.outputs.integration_qa == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: life-integration-qa-pr
          path: artifacts/integration-qa/
          if-no-files-found: ignore
      - name: Preserve boot screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-boot-390x844
          path: artifacts/ci-boot/
          if-no-files-found: ignore
