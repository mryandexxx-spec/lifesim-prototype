name: CI — change-aware Node and one-screen WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: targeted-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cf-anim-rig-calibration:
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnostic/cf-anim-rig-contract' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        rig: [male-grid_021-100, male-grid_021-90, female-grid_201-100, female-grid_201-110]
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: saturday06/VRM-Addon-for-Blender
          ref: 0428e04fe0a7916cba257ad7876c8cc5268cf316
          path: vrm-addon
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9a4d8adaccbf55572346904750e252565d30d924
          path: prior-code
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: cf-body-d-tools-full-rig
          run-id: 45681068614
          github-token: ${{ github.token }}
          path: input-rigs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned calibration dependencies
        run: |
          test "$(git -C vrm-addon rev-parse HEAD)" = 0428e04fe0a7916cba257ad7876c8cc5268cf316
          test -z "$(git -C vrm-addon status --porcelain)"
          python -m pip install --only-binary=:all: bpy==4.5.0 numpy==1.26.4 imageio-ffmpeg==0.6.0
          python -m py_compile tools/cf_anim_rig_calibration.py
      - name: Reversible native calibration and six evidence renders
        env:
          RIG: ${{ matrix.rig }}
        run: timeout --signal=TERM --kill-after=10s 180s python -u tools/cf_anim_rig_calibration.py "$RIG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-anim-rig-contract-r2a-evidence-${{ matrix.rig }}
          path: artifacts/cf-anim-rig-contract-r2a/
          if-no-files-found: warn
  cf-anim-rig-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnostic/cf-anim-rig-contract' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: cf-body-d-tools-full-rig
          run-id: 45681068614
          github-token: ${{ github.token }}
          path: input-rigs
      - uses: actions/download-artifact@v4
        with:
          name: cf-interact-01c-balance-male-grid_021-100-evidence
          run-id: 45873763915
          github-token: ${{ github.token }}
          path: input-caches/male-grid_021-100
      - uses: actions/download-artifact@v4
        with:
          name: cf-interact-01c-balance-male-grid_021-90-evidence
          run-id: 45873763915
          github-token: ${{ github.token }}
          path: input-caches/male-grid_021-90
      - uses: actions/download-artifact@v4
        with:
          name: cf-interact-01c-balance-female-grid_201-100-evidence
          run-id: 45873763915
          github-token: ${{ github.token }}
          path: input-caches/female-grid_201-100
      - uses: actions/download-artifact@v4
        with:
          name: cf-interact-01c-balance-female-grid_201-110-evidence
          run-id: 45873763915
          github-token: ${{ github.token }}
          path: input-caches/female-grid_201-110
      - name: Pinned external humanoid implementation (isolated; no game dependencies)
        run: |
          npm install --prefix "$RUNNER_TEMP/rig-contract" --ignore-scripts --no-audit --no-fund --save-exact three@0.177.0 @pixiv/three-vrm-core@3.4.2
          cp tools/cf_anim_rig_contract.mjs "$RUNNER_TEMP/rig-contract/probe.mjs"
          node --check "$RUNNER_TEMP/rig-contract/probe.mjs"
          node "$RUNNER_TEMP/rig-contract/probe.mjs"
          cp "$RUNNER_TEMP/rig-contract/package-lock.json" artifacts/cf-anim-rig-contract/dependency-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-anim-rig-contract-r1-evidence
          path: artifacts/cf-anim-rig-contract/
          if-no-files-found: warn
  ux3-06-input-ownership:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/ux3-06-world-gesture-ownership' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gesture ownership and camera regression
        run: node --test tests/mobile-gesture-policy.test.js tests/camera-gestures.test.js tests/camera-social-regression.test.js tests/ux3-06-furniture-labels.test.js tests/dialogue-decision.test.js
      - name: Actual social and purchased-object touch regressions
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux3-06-http.log 2>&1 &
          sleep 3
          node tests/ux3-06-browser.mjs
        env:
          GQ_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux3-06-touch-evidence
          path: artifacts/ux3-06/
          if-no-files-found: warn
  pf-14-garden-care:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pf-14-garden-care' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Garden care and existing garden contracts
        run: node --test tests/pf-14-garden-care.test.js tests/lot-c1.test.js tests/lot-c2c-mobile.test.js tests/lot-c3c.test.js
      - name: Real Chromium and WebKit garden menu, timed action and reload
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-14-http.log 2>&1 &
          sleep 3
          node tests/pf-14-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-14-garden-evidence
          path: artifacts/pf-14/
          if-no-files-found: warn
  pf-13-flowers:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/pf-13-flower-batch' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pf-13-flower-batch.yml
  pf-15-speed:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/pf-15-household-auto-speed' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pf-15-speed.yml
  gq-playtest:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/gq-03-playtest' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/gq-playtest.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
  of-integration-e:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/of-integration-e' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact pool GLBs, all sides, original swim and editor contracts
        run: node --test tests/of-integration-e.test.js tests/lot-d1b.test.js tests/lot-d1c.test.js tests/lot-d2a.test.js tests/lot-d2b.test.js tests/lot-d2c.test.js tests/lot-d2d.test.js tests/lot-d3a.test.js tests/lot-d3b-stress.test.js
      - name: Actual Chromium and WebKit native and legacy pool fixtures
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor artifacts/lot-d2c
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/of-e-http.log 2>&1 &
          sleep 3
          node tests/of-e-browser-smoke.mjs
          node tests/lot-d2c-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: of-e-game-evidence
          path: |
            artifacts/of-e/
            artifacts/lot-d2c/
          if-no-files-found: warn
  pf-12-rotation:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/pf-12-outdoor-rotation-preview' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pf-12-rotation.yml
  of-integration-d:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/of-integration-d' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact native outdoor GLBs, seating, cooking, lights and save contracts
        run: node --test tests/of-integration-d.test.js tests/lot-b3.test.js tests/grill-r1.test.js tests/furniture-shop-integration.test.js
      - name: Actual Chromium and WebKit outdoor day/night and active overlay
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/of-d-http.log 2>&1 &
          sleep 3
          node tests/of-d-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: of-d-game-evidence
          path: artifacts/of-d/
          if-no-files-found: warn
  of-integration-c:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/of-integration-c' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact garden GLBs, wet growth and real care/harvest/replant contracts
        run: node --test tests/of-integration-c.test.js tests/lot-c1.test.js tests/lot-c3a.test.js tests/garden-r1.test.js
      - name: Actual Chromium and WebKit native garden states
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/of-c-http.log 2>&1 &
          sleep 3
          node tests/of-c-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: of-c-game-evidence
          path: artifacts/of-c/
          if-no-files-found: warn
  of-integration-b:
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/of-integration-b' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and vegetation tests
        run: node --test tests/of-integration-b.test.js
      - name: Real game WebGL and comparative 36-feature lot profile
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/of-b-http.log 2>&1 &
          sleep 3
          node tests/of-b-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: of-b-game-evidence
          path: artifacts/of-b/
          if-no-files-found: warn
  of-integration-a:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/of-integration-a' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: of-mass-evidence
          run-id: 45654383776
          github-token: ${{ github.token }}
          path: /tmp/of-mass
      - name: Verify approved model hashes and exact committed thumbnails
        run: |
          node --test tests/of-integration-a.test.js
          node scripts/of-a-thumbnails.mjs /tmp/of-mass
          git diff --exit-code -- assets/furniture/of-r2/thumbnails/
          test -z "$(git ls-files --others --exclude-standard assets/furniture/of-r2/thumbnails/)"
      - name: Real game Chromium and WebKit — 20 SKU, thumbnails and v1 reload
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/of-a-http.log 2>&1 &
          sleep 3
          node tests/of-a-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: of-a-game-evidence
          path: artifacts/of-a/
          if-no-files-found: warn
  cf-cpu-portability:
    if: github.event_name == 'pull_request' && github.head_ref == 'infra/cf-infra-01-cpu-pilot' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/cf-cpu-portability.yml
  targeted:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      browser: ${{ steps.impact.outputs.browser }}
      parcel_editor: ${{ steps.impact.outputs.parcel_editor }}
      cas_inventory: ${{ steps.impact.outputs.cas_inventory }}
      cas_baseline: ${{ steps.impact.outputs.cas_baseline }}
      cas_hud: ${{ steps.impact.outputs.cas_hud }}
      cas_soak: ${{ steps.impact.outputs.cas_soak }}
      qsk_02: ${{ steps.impact.outputs.qsk_02 }}
      cas_modular: ${{ steps.impact.outputs.cas_modular }}
      cas_alex: ${{ steps.impact.outputs.cas_alex }}
      cas_styles: ${{ steps.impact.outputs.cas_styles }}
      cas_cc0: ${{ steps.impact.outputs.cas_cc0 }}
      cas_c3: ${{ steps.impact.outputs.cas_c3 }}
      e5: ${{ steps.impact.outputs.e5 }}
      fixture_motion: ${{ steps.impact.outputs.fixture_motion }}
      integration_qa: ${{ steps.impact.outputs.integration_qa }}
      micro_ux: ${{ steps.impact.outputs.micro_ux }}
      load_truth: ${{ steps.impact.outputs.load_truth }}
      fridge_ux: ${{ steps.impact.outputs.fridge_ux }}
      grill_r1: ${{ steps.impact.outputs.grill_r1 }}
      career_shifts: ${{ steps.impact.outputs.career_shifts }}
      phone_platform: ${{ steps.impact.outputs.phone_platform }}
      fandom_tv: ${{ steps.impact.outputs.fandom_tv }}
      fandom_phone: ${{ steps.impact.outputs.fandom_phone }}
      fandom_r2a: ${{ steps.impact.outputs.fandom_r2a }}
      fandom_r2b: ${{ steps.impact.outputs.fandom_r2b }}
      fandom_r2c: ${{ steps.impact.outputs.fandom_r2c }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prevent automatic historical workflow fan-out
        run: node scripts/ci-guard.mjs
      - name: Syntax and dependency-aware affected Node tests
        id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-target.mjs
      - name: QSK-05 audit actual pinned original rig clip joint matrix
        if: ${{ contains(github.event.pull_request.title, 'QSK-05') }}
        run: |
          node --test tests/qsk-05-contact-matrix.test.js
          node scripts/qsk-05-contact-matrix.mjs
      - name: Archive QSK-05 read-only source joint matrix and blocked CAS gaps
        if: ${{ always() && contains(github.event.pull_request.title, 'QSK-05') }}
        uses: actions/upload-artifact@v4
        with:
          name: qsk-05-original-joint-matrix-pr
          path: artifacts/qsk-05/original-rig-matrix.json
          if-no-files-found: error
      - name: QSK-04 audit pinned GLB, textures and provenance (no runtime changes)
        if: ${{ contains(github.event.pull_request.title, 'QSK-04') }}
        run: node scripts/qsk-04-asset-qa.mjs
      - name: Archive QSK-04 GLB source and validation passport
        if: ${{ always() && contains(github.event.pull_request.title, 'QSK-04') }}
        uses: actions/upload-artifact@v4
        with:
          name: qsk-04-pinned-asset-passport-pr
          path: artifacts/qsk-04/asset-passport.json
          if-no-files-found: warn
      - name: Archive CAS-01.8 Node eight-day soak report
        if: ${{ always() && steps.impact.outputs.cas_soak == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-01-8-node-pr
          path: artifacts/cas-01-8/node.json
          if-no-files-found: ignore
      - name: CAS-00 full-src resident dependency inventory (not a four-person simulation)
        if: ${{ steps.impact.outputs.cas_inventory == 'true' }}
        run: node scripts/cas-00-dependency-inventory.mjs
      - name: Archive CAS-00 complete source lexical inventory
        if: ${{ always() && steps.impact.outputs.cas_inventory == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-00-source-inventory
          path: artifacts/cas-00/resident-dependency-inventory.json
          if-no-files-found: error
  mobile-webgl-smoke:
    needs: targeted
    if: ${{ needs.targeted.outputs.browser == 'true' || needs.targeted.outputs.cas_cc0 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Chromium only when browser-facing code changed
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Real PlayCanvas startup at one iPhone viewport
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ci-target-http.log 2>&1 &
          sleep 3
          node tests/ci-browser-boot.mjs
      - name: QSK-05 real original rig movement in 390x844 and 320x568 PlayCanvas
        if: ${{ contains(github.event.pull_request.title, 'QSK-05') }}
        run: node tests/qsk-05-browser-contacts.mjs
      - name: Archive QSK-05 PlayCanvas clip frames (non-contact-certified)
        if: ${{ always() && contains(github.event.pull_request.title, 'QSK-05') }}
        uses: actions/upload-artifact@v4
        with:
          name: qsk-05-original-mobile-webgl-pr
          path: |
            artifacts/qsk-05/browser-contact-report.json
            artifacts/qsk-05/*.png
          if-no-files-found: warn
      - name: QSK-04 capture 12 real PlayCanvas Alex/Mira reference frames
        if: ${{ contains(github.event.pull_request.title, 'QSK-04') }}
        run: node tests/qsk-04-browser-visual.mjs
      - name: Archive QSK-04 real mobile WebGL reference screenshots
        if: ${{ always() && contains(github.event.pull_request.title, 'QSK-04') }}
        uses: actions/upload-artifact@v4
        with:
          name: qsk-04-mobile-playcanvas-reference-pr
          path: |
            artifacts/qsk-04/visual-report.json
            artifacts/qsk-04/*.png
          if-no-files-found: warn
      - name: CAS-02.2-A source Alex and Mira real morph targets in four mobile PlayCanvas cases
        if: ${{ contains(github.event.pull_request.title, 'CAS-02.2') }}
        run: |
          node scripts/cas-02-2-morphs.mjs
          node tests/cas-02-2-browser-smoke.mjs
      - name: Archive CAS-02.2-A two-resident geometry screenshot evidence
        if: ${{ always() && contains(github.event.pull_request.title, 'CAS-02.2') }}
        uses: actions/upload-artifact@v4
        with:
          name: cas-02-2-a-morphs-mobile-pr
          path: artifacts/cas-02-2-a/
          if-no-files-found: ignore
      - name: CAS F2 C3 resident rigs and mobile WebGL
        if: ${{ needs.targeted.outputs.cas_c3 == 'true' }}
        run: |
          node scripts/cas-02-1-f0-download-assets.mjs
          node scripts/cas-c3-shoes.mjs
          CAS_C3_REQUIRE_ASSETS=1 node --test tests/cas-02-1-f2-c3-*.test.js
          node scripts/cas-c3-probe-fourth.mjs
          node tests/cas-02-1-f2-c3-browser-smoke.mjs
      - name: Restore audited female vendor source GLB cache
        if: ${{ needs.targeted.outputs.cas_c3 == 'true' }}
        id: c4-source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/characters/cas-c3/c4-*.source.glb
            assets/characters/cas-c3/c4-source-manifest.json
          key: cas-c4b-approved-vendor-glbs-v1-6e7d8d-768ce0-c2e390
      - name: Prepare and SHA-check authentic CC0 female source GLBs
        if: ${{ needs.targeted.outputs.cas_c3 == 'true' }}
        run: |
          python3 -m unittest discover -s tests -p 'test_cas_c4_source_audit.py' -v
