name: UX-05 — resident card and required choices
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux05:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install, syntax checks and full Node suite
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node --check src/game.js
          node --check src/ux05-character-ui.js
          node --check tests/ux05-browser-smoke.mjs
          npm test
      - name: Four live PlayCanvas/WebGL mobile smoke tests
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux05.log 2>&1 &
          sleep 3
          node tests/ux05-browser-smoke.mjs
      - name: Preserve diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux05-character-social-four-sizes
          path: ux05-artifacts/
          if-no-files-found: ignore
