name: LOT-D2d — final pool lifecycle and four-view WebGL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d2d-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlayCanvas and headless Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Complete swimming, two residents, saves, long-run, full regression
        run: |
          node --check src/pool-autonomy.js
          node --check src/pool-swim-runtime.js
          node --check src/psychology.js
          node --check src/game.js
          node --check tests/lot-d2d-browser-smoke.mjs
          node --test tests/lot-d2a.test.js tests/lot-d2b.test.js tests/lot-d2c.test.js tests/lot-d2d.test.js
          npm test
      - name: Real four viewport PlayCanvas/WebGL two-swimmer scene and touch
        run: |
          mkdir -p vendor artifacts/lot-d2d
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-d2d-webgl.log 2>&1 &
          sleep 3
          node tests/lot-d2d-browser-smoke.mjs
      - name: Upload real WebGL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-d2d-two-swimmers-four-viewport
          path: artifacts/lot-d2d/
          if-no-files-found: ignore
      - name: Verify Pages includes the new pure autonomy module
        run: |
          grep -F 'src/pool-swim-runtime.js src/pool-autonomy.js site/src/' .github/workflows/pages.yml
