name: W3-A — time off and paid leave mobile WebGL QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  time-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlayCanvas and real Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Run pure leave tests and all existing regression tests
        run: |
          node --check src/career-timeoff.js
          node --check src/career-state.js
          node --check src/career-work.js
          node --check src/career-phone-ui.js
          node --check src/career-job-board.js
          node --check src/finance-ledger.js
          node --check src/calendar-ui.js
          node --check tests/w3a-browser-smoke.mjs
          node --test tests/w3a-timeoff.test.js
          npm test
      - name: Real mobile PlayCanvas WebGL leave booking and save recovery
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w3a-http.log 2>&1 &
          sleep 3
          node tests/w3a-browser-smoke.mjs
      - name: Publish touch screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3a-timeoff-mobile-webgl-screenshots
          path: w3a-timeoff-*.png
          if-no-files-found: ignore
