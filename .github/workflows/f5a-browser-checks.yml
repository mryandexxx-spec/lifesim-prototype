name: F5-A construction WebGL Safari-size smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  construction-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: |
          node --check src/game.js
          node --check src/calendar-ui.js
          node --check src/calendar-core.js
          node --check src/calendar-events.js
          node --check src/construction.js
          node --check src/furnished-room.js
          node --check src/exterior-construction.js
          node --check src/navigation.js
          node --check src/household.js
          npm test
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Serve production module graph with pinned PlayCanvas
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/f5a-http.log 2>&1 &
      - name: Real WebGL touch panel, save and reload smoke
        run: |
          node tests/w1a4-browser-smoke.mjs
          node tests/w1a3-browser-smoke.mjs
          node tests/f5a-browser-smoke.mjs
          node tests/f5d1-browser-smoke.mjs
          node tests/f5d2-browser-smoke.mjs
          node tests/f5d3-joined-room-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f5a-browser-screenshot
          path: |
            w1a4-calendar-summer-day.png
            w1a3-mobile-calendar.png
            f5a-browser-build.png
            f5b-browser-finish.png
            f5b2-browser-openings.png
            f5b3-original-wall-openings.png
            f5b4-ceiling-preview.png
            f5b4-floor-direction.png
            f5c1-auto-roof.png
            f5c1-hip-roof.png
            f5c2-tall-facade.png
            f5c2-porch.png
            f5d1-room-copy-preview.png
            f5d2-furnished-room-move-preview.png
            f5d3-joined-room-preview.png
          retention-days: 7
