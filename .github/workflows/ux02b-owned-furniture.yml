name: UX-02b — owned furniture preview, storage and sale WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux02b:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlayCanvas and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Complete Node regressions and source syntax
        run: |
          node --check src/game.js
          node --check src/furniture-owned-preview.js
          node --check tests/ux02b-browser-smoke.mjs
          npm test
      - name: Real PlayCanvas and four viewport touch workflows
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux02b.log 2>&1 &
          sleep 3
          node tests/ux02b-browser-smoke.mjs
      - name: Save mobile screenshots, touch target bounds and states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux02b-four-size-owned-preview-storage-sale
          path: ux02b-artifacts/
          if-no-files-found: ignore
