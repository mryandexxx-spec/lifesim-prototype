name: LOT-D2c — visible swimming and mobile pool touch
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d2c-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlayCanvas and headless Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Unit water-visual projection, queue integration and full regression
        run: |
          node --check src/game.js
          node --check src/animations.js
          node --check src/pool-swim-visual.js
          node --check src/pool-touch-policy.js
          node --check tests/lot-d2c-browser-smoke.mjs
          node --test tests/lot-d2b.test.js tests/lot-d2c.test.js
          npm test
      - name: Real WebGL mobile swimming screenshots, touch and cancellation
        run: |
          mkdir -p vendor artifacts/lot-d2c
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-d2c-webgl.log 2>&1 &
          sleep 3
          node tests/lot-d2c-browser-smoke.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-d2c-webgl-four-viewports
          path: artifacts/lot-d2c/
          if-no-files-found: ignore
      - name: Check exact Pages static module packaging
        run: |
          grep -F 'cp src/pool-swim-visual.js src/pool-touch-policy.js site/src/' .github/workflows/pages.yml
