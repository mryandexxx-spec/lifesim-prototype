name: LOT-C3a — finite herb harvest and replant
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  garden-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax of adapted game and domain
        run: |
          node --check src/gardening.js
          node --check src/kitchen.js
          node --check src/household.js
          node --check src/simulation.js
          node --check src/action-queue.js
          node --check src/garden-presentation.js
          node --check src/game.js
      - name: Harvest, prior garden, kitchen and psychology regressions
        run: node --test tests/lot-c3a.test.js tests/lot-c1.test.js tests/lot-c2a-autonomy.test.js tests/lot-c2b-psychology.test.js tests/lot-c2c-mobile.test.js tests/f4g-kitchen.test.js
