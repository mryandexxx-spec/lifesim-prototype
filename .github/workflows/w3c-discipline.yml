name: W3-C — work discipline and rehire mobile QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discipline:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and real Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Source syntax and full deterministic Node regression
        run: |
          node --check src/career-discipline.js
          node --check src/career-state.js
          node --check src/career-work.js
          node --check src/career-recruitment.js
          node --check src/career-job-board.js
          node --check src/career-phone-ui.js
          node --check src/career-shift-summary-ui.js
          node --check tests/w3c-browser-smoke.mjs
          node --test tests/w3c-discipline.test.js
          npm test
      - name: Four mobile viewports genuine PlayCanvas WebGL tap and reload
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w3c-http.log 2>&1 &
          sleep 3
          node tests/w3c-browser-smoke.mjs
      - name: Publish W3-C mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3c-mobile-webgl-screenshots
          path: w3c-*.png
          if-no-files-found: ignore
