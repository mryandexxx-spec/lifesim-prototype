name: LIFE NEEDS-R2 — moderate six-need economy and mobile WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  needs-r2:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check balance source and exact R2 tests, full repo regression
        run: |
          npm ci
          node --check src/need-balance.js
          node --check tests/life-needs-r2.test.js
          node --check scripts/life-needs-r2-validate.mjs
          node --test tests/life-needs-r2.test.js tests/needs-balance.test.js
          npm test
      - name: Real 24-hour, week and month simulation, two people and work
        run: |
          mkdir -p life-needs-r2-artifacts
          node scripts/q3a-diagnostics.mjs > life-needs-r2-artifacts/raw.log
          node scripts/life-needs-r2-validate.mjs life-needs-r2-artifacts/raw.log
          git diff --exit-code -- src/
      - name: Install mobile Chromium for actual PlayCanvas WebGL evidence
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Four iPhone-size WebGL viewports, touch and root-v1 save smoke
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/life-needs-r2-http.log 2>&1 &
          sleep 3
          node tests/ux09-browser-smoke.mjs
      - name: Preserve quantitative and browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-needs-r2-regression-evidence
          path: |
            life-needs-r2-artifacts/
            ux09-artifacts/
          if-no-files-found: ignore
