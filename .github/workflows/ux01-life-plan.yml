name: UX-01 — mobile Life HUD, dual queue and WebGL comparison
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux01:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 15334e34747d281c3cbb9c7ffd8dbc2f1f90b21b
          path: ux01-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Source syntax, explicit UX-01 regressions and full suite
        run: |
          node --check src/game.js
          node --check src/ux01-plan-ui.js
          node --check tests/ux01-browser-smoke.mjs
          node --test tests/ux01-life-hud.test.js tests/ui-live-plan.test.js tests/comfort-c2-hud.test.js tests/manual-priority-queue-stability.test.js
          npm test
      - name: Two identical real PlayCanvas sites, four mobile viewports
        run: |
          mkdir -p vendor ux01-baseline/vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          cp node_modules/playcanvas/build/playcanvas.mjs ux01-baseline/vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux01-candidate.log 2>&1 &
          (cd ux01-baseline && python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/ux01-baseline.log 2>&1) &
          sleep 3
          node tests/ux01-browser-smoke.mjs
      - name: Keep 4-size paired screenshots and DOM metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux01-life-plan-before-after
          path: ux01-artifacts/
          if-no-files-found: ignore
