name: LIFE COOK-R1 — skills, meal quality, cost and mobile WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cook-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate cooking economy, quality, save-v1 and FOOD-R1
        run: |
          npm ci
          node --check src/kitchen.js
          node --check src/kitchen-market.js
          node --check src/household.js
          node --check src/simulation.js
          node --check src/hobby-reading.js
          node --check src/game.js
          node --check tests/life-cook-r1-browser-smoke.mjs
          node --test tests/life-cook-r1.test.js
          node --test tests/life-food-r1.test.js
          npm test
      - name: Install mobile Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Four Safari-sized mobile touch viewports and real PlayCanvas WebGL
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cook-r1-http.log 2>&1 &
          sleep 3
          node tests/life-cook-r1-browser-smoke.mjs
