name: LOT-E1 — mixed-yard A-star and four-view PlayCanvas performance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measured-mixed-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PlayCanvas and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Validate QA-only AppStats hook and all root-v1 tests
        run: |
          node --check src/game.js
          node --check tests/lot-e1-navigation-benchmark.mjs
          node --check tests/lot-e1-browser-benchmark.mjs
          npm test
      - name: Measure canonical mixed-world A-star p50 p95 p99
        run: |
          mkdir -p artifacts/lot-e1
          node tests/lot-e1-navigation-benchmark.mjs
      - name: Measure real PlayCanvas/WebGL on four mobile viewports
        run: |
          mkdir -p vendor artifacts/lot-e1
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-e1-http.log 2>&1 &
          sleep 3
          node tests/lot-e1-browser-benchmark.mjs
      - name: Publish measured reports and four WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-e1-mixed-astar-webgl-baseline
          path: artifacts/lot-e1/
          if-no-files-found: ignore
