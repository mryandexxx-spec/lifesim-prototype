name: LOT-C3c — four mobile WebGL and 30-day garden/kitchen integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c3c-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PlayCanvas and browser
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Source syntax and full game regression
        run: |
          node --check tests/lot-c3c.test.js
          node --check tests/lot-c3c-browser-smoke.mjs
          node --check src/gardening.js
          node --check src/kitchen-market.js
          node --check src/household.js
          node --check src/game.js
          npm test
      - name: Real PlayCanvas four-size mobile UI and finance
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-c3c-webgl.log 2>&1 &
          sleep 3
          node tests/lot-c3c-browser-smoke.mjs
      - name: Retain mobile screenshots, bounds and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-c3c-four-size-webgl-and-economy
          path: lot-c3c-artifacts/
          if-no-files-found: ignore
