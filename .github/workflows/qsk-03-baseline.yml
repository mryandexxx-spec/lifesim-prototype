name: QSK-03 — independent PlayCanvas mobile performance baseline
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qsk-03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  measured-mobile-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned game and temporary browser test dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: QSK-03 independent metrics unit contracts
        run: node --test tests/qsk-03-metrics.test.js
      - name: Reproduce 2/4 resident cold-warm PlayCanvas mobile baseline
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/qsk-03-server.log 2>&1 &
          sleep 3
          node tests/qsk-03-browser-baseline.mjs
      - name: Archive benchmark JSON and real WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qsk-03-mobile-browser-baseline
          path: artifacts/qsk-03/
          if-no-files-found: warn
