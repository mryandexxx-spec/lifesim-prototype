name: Meshy V3 — real GLB store thumbnails and model QA
on:
  push:
    branches: [feature/meshy-v3-live-20261120]
    paths: [.github/workflows/meshy-v3-thumbnails.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PlayCanvas and headless Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
      - name: Start local game server and render all 13 actual GLB thumbnails
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/meshy-v3-http.log 2>&1 &
          sleep 3
          node tests/meshy-v3-thumbnail-generator.mjs
          test "$(find assets/furniture/meshy-room-v3/thumbnails -name '*.png' | wc -l)" -eq 13
      - name: Store exactly validated 13 PNGs on feature branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/furniture/meshy-room-v3/thumbnails/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Thumbnails already match the committed output"
            exit 0
          fi
          git commit -m "assets(meshy): render 13 true WebGL store images for V3 GLBs"
          git fetch origin feature/meshy-v3-live-20261120
          git rebase origin/feature/meshy-v3-live-20261120
          git push origin HEAD:feature/meshy-v3-live-20261120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meshy-v3-real-glb-thumbnails
          path: assets/furniture/meshy-room-v3/thumbnails/
          if-no-files-found: ignore
