name: Q2 — starter furniture warehouse and sale mobile WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  q2-starter-furniture:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node modules and browser
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify complete headless regression and syntax
        run: |
          node --check src/furniture-catalog.js
          node --check src/furniture-shop.js
          node --check src/game.js
          node --check tests/q2-browser-smoke.mjs
          npm test
      - name: Test real PlayCanvas/WebGL and full starter furniture lifecycle
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/q2-http.log 2>&1 &
          sleep 3
          node tests/q2-browser-smoke.mjs
      - name: Collect four-viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: q2-starter-mobile-webgl
          path: q2-starter-*.png
          if-no-files-found: ignore
