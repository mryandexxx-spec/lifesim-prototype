name: LOT-A — mobile outdoor tap-to-walk & save regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outdoor-walk:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Native unit / full regression / source checks
        run: |
          node --check src/lot-surface.js
          node --check src/navigation.js
          node --check src/simulation.js
          node --check src/action-queue.js
          node --check src/household.js
          node --check src/camera-controls.js
          node --check src/game.js
          node --check tests/lot-a-browser-smoke.mjs
          node --test tests/lot-a.test.js
          npm test
      - name: Real mobile WebGL touch and save smoke
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/lot-a-http.log 2>&1 &
          sleep 3
          node tests/lot-a-browser-smoke.mjs
      - name: Publish mobile screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-a-mobile-webgl
          path: lot-a-*.png
          if-no-files-found: ignore
