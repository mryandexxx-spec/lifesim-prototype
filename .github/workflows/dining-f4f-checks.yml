name: F4F functional dining regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci
          node --check src/dining.js
          node --check src/seat-furniture.js
          node --check src/furniture-layout.js
          node --check src/game.js
          node --check src/household.js
          node --check src/animations.js
          node --check src/meshy-visual.js
          node --check src/meshy-mira-visual.js
          node --test tests/furniture-f4f-dining.test.js tests/furniture-f4f-chair-clearance.test.js
          npm test
