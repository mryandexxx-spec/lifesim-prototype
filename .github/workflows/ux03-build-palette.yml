name: UX-03 — construction tool palette and mobile rooms
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux03:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Build palette syntax and full regressions
        run: |
          node --check src/game.js
          node --check src/build-tool-palette.js
          node --check tests/ux03-browser-smoke.mjs
          npm test
      - name: PlayCanvas iPhone and landscape construction
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux03.log 2>&1 &
          sleep 3
          node tests/ux03-browser-smoke.mjs
      - name: Screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux03-mobile-six-palettes
          path: ux03-artifacts/
          if-no-files-found: ignore
