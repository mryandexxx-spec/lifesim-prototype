name: LOT-B3 — garden bench, real rest and outdoor night lighting
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outdoor-furniture:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node and genuine Chromium WebGL
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Domain, save, action and entire Node regression
        run: |
          node --check src/game.js
          node --check src/outdoor-interactions.js
          node --check src/outdoor-proposals.js
          node --check src/household.js
          node --check src/simulation.js
          node --check src/action-queue.js
          node --check tests/lot-b3-browser-smoke.mjs
          node --test tests/lot-b3.test.js tests/lot-b2.test.js tests/lot-b1-ui.test.js
          npm test
      - name: Actual PlayCanvas/WebGL mobile lighting and seat QA
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-b3-http.log 2>&1 &
          sleep 3
          node tests/lot-b3-browser-smoke.mjs
      - name: Save mobile screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-b3-mobile-webgl
          path: lot-b3-*.png
          if-no-files-found: ignore
