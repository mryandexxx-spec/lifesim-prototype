name: LOT-C1 — functional gardens and iPhone WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  garden-real-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Playwright Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Garden Node and full regression
        run: |
          node --check src/gardening.js
          node --check src/game.js
          node --check src/simulation.js
          node --check src/household.js
          node --check src/outdoor-proposals.js
          node --check tests/lot-c1.test.js
          node --test tests/lot-c1.test.js
          npm test
      - name: Real PlayCanvas mobile WebGL
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-c1-http.log 2>&1 &
          sleep 3
          node tests/lot-c1-browser-smoke.mjs
      - name: Retain mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-c1-mobile-webgl
          path: lot-c1-*.png
          if-no-files-found: ignore
