name: W1-B.3b.3 work stories iPhone-sized PlayCanvas QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  work-stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlayCanvas and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Node save, salary, career, recruitment and original incidents regressions
        run: |
          node --check src/career-incidents.js
          node --check src/career-state.js
          node --check src/career-work.js
          node --check src/career-phone-ui.js
          node --check src/game.js
          node --test tests/w1b3b3-work-stories.test.js tests/w1b3b2-work-incidents.test.js tests/w1b3b1-career-growth.test.js tests/w1b3a-real-work.test.js tests/w1b2b3-recruitment.test.js
          npm test
      - name: PlayCanvas WebGL 390x844 real touch, Safari-like storage reload
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w1b3b3-http.log 2>&1 &
          sleep 2
          node tests/w1b3b3-browser-smoke.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1b3b3-work-stories-390x844
          path: w1b3b3-*-iphone.png
          if-no-files-found: ignore
