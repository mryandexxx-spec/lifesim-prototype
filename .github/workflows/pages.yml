name: Test and deploy Блин’С to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game rules and browser source syntax
        run: |
          npm ci
          npm test
          node --check src/game.js
          node --check src/loading-progress.js
          node --check src/model-cache.js
          node --check sw.js
          node --check src/simulation.js
          node --check src/career-catalog.js
          node --check src/career-scheduler.js
          node --check src/career-state.js
          node --check src/career-job-board.js
          node --check src/career-phone-ui.js
          node --check src/career-recruitment.js
          node --check src/career-work.js
          node --check src/career-progression.js
          node --check src/calendar-core.js
          node --check src/calendar-events.js
          node --check src/calendar-holidays.js
          node --check src/calendar-reminders.js
          node --check src/calendar-ui.js
          node --check src/day-night-cycle.js
          node --check src/day-night-render.js
          node --check src/need-balance.js
          node --check src/navigation.js
          node --check src/construction.js
          node --check src/furnished-room.js
          node --check src/roof-construction.js
          node --check src/exterior-construction.js
          node --check src/furniture-catalog.js
          node --check src/furniture-layout.js
          node --check src/furniture-editor.js
          node --check src/furniture-hold.js
          node --check src/furniture-shop.js
          node --check src/furniture-products.js
          node --check src/furniture-procedural-library.js
          node --check src/dining.js
          node --check src/kitchen.js
          node --check src/seat-furniture.js
          node --check src/furniture-interactions.js
          node --check src/furniture-thumbnails.js
          node --check src/furniture-value.js
          node --check src/object-definition-registry.js
          node --check src/object-effect-engine.js
          node --check src/object-once-ledger.js
          node --check src/object-legacy-adapter.js
          node --check src/object-use-runtime.js
          node --check src/object-quality-presentation.js
          node --check src/object-quality-comparison.js
          node --check src/shop-catalog-selector.js
          node --check src/skill-registry.js
          node --check src/skill-presentation.js
          node --check src/skills-engine.js
          node --check src/activity-registry.js
          node --check src/painting.js
          node --check src/painting-visual.js
          node --check src/meshy-painting-runtime.js
          node --check src/hobby-reading.js
          node --check src/music-audio.js
          node --check src/music-listening.js
          node --check src/paired-hobby.js
          node --check src/music-movement.js
          node --check src/meshy-music-runtime.js
          node --check src/reading-journey.js
          node --check src/activity-session.js
          node --check src/hobby-content.js
          node --check src/tv-interaction.js
          node --check src/tv-seating.js
          node --check src/tv-together.js
          node --check src/furniture-placement-preview.js
          node --check src/furniture-transform.js
          node --check src/psychology.js
          node --check src/environment-effects.js
          node --check src/mood-presentation.js
          node --check src/trait-catalog.js
          node --check src/sim-events.js
          node --check src/emotion-engine.js
          node --check src/social-perspective.js
          node --check src/social-graph.js
          node --check src/action-queue.js
          node --check src/conversation-engine.js
          node --check src/dialogue-decision.js
          node --check src/world-interactions.js
          node --check src/plan-preview.js
          node --check src/ui-layout.js
          node --check src/insight-presentation.js
          node --check src/required-choice-focus.js
          node --check src/mood-action-policy.js
          node --check src/social-need.js
          node --check src/gifts-leisure.js
          node --check src/household.js
          node --check src/relationships.js
          node --check src/social-reactions.js
          node --check src/social-feedback.js
          node --check src/social-episodes.js
          node --check src/social-compatibility.js
          node --check src/social-boundaries.js
          node --check src/social-dynamics.js
          node --check src/romance.js
          node --check src/romantic-hug.js
          node --check src/romantic-kiss.js
          node --check src/romantic-intimacy.js
          node --check src/romantic-evening-scene.js
          node --check src/romantic-evening-stage.js
          node --check src/romantic-sofa-stage.js
          node --check src/meshy-reading-runtime.js
          node --check src/meshy-kiss-runtime.js
          node --check src/meshy-hug-runtime.js
          node --check src/reaction-badges.js
          node --check src/characters.js
          node --check src/animations.js
          node --check src/pose-config.js
          node --check src/sofa-transition.js
          node --check src/camera-controls.js
          node --check src/camera-gestures.js
          node --check src/mobile-gesture-policy.js
          node --check src/ui-onboarding.js
          node --check src/hud-panel.js
          node --check src/locomotion.js
          node --check src/bed-layout.js
          node --check src/bed-transition.js
          node --check src/fridge-interaction.js
          node --check src/shower-interaction.js
          node --check src/toilet-interaction.js
          node --check src/meshy-toilet-pose.js
          node --check src/privacy-mosaic.js
          node --check src/character-lab.js
          node --check src/character-lab-config.js
          node --check src/meshy-visual.js
          node --check src/meshy-fridge-runtime.js
          node --check src/meshy-bed-runtime.js
          node --check src/meshy-shower-runtime.js
          node --check src/meshy-visual-policy.js
          node --check src/meshy-sofa-pose.js
          node --check src/interaction-anchors.js
          node --check src/meshy-seat-runtime.js
          node --check src/meshy-mira-visual.js
          node --check src/meshy-mira-sofa.js
          node --check src/meshy-mira-bed.js
          node --check src/meshy-mira-policy.js
      - name: Verify optimized Meshy GLB SHA-256
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
      - name: Assemble static website
        run: |
          mkdir -p site/src site/vendor
          test -s node_modules/playcanvas/build/playcanvas.mjs
          cp node_modules/playcanvas/build/playcanvas.mjs site/vendor/
          mkdir -p site/src
          cp index.html character-lab.html character-lab-mira.html styles.css favicon.svg manifest.webmanifest sw.js .nojekyll site/
          mkdir -p site/src
          cp src/plan-preview.js src/ui-layout.js src/required-choice-focus.js site/src/
          cp src/insight-presentation.js site/src/
          cp src/camera-gestures.js site/src/
          cp src/mobile-gesture-policy.js site/src/
          cp src/construction.js site/src/
          cp src/furnished-room.js site/src/
          cp src/roof-construction.js site/src/
          cp src/exterior-construction.js site/src/
          cp src/ui-onboarding.js site/src/
          cp src/hud-panel.js site/src/
          cp src/furniture-catalog.js src/furniture-layout.js src/furniture-editor.js src/furniture-transform.js src/furniture-hold.js site/src/
          cp src/furniture-shop.js src/furniture-value.js site/src/
          cp src/furniture-products.js src/furniture-procedural-library.js src/furniture-thumbnails.js src/seat-furniture.js src/dining.js src/furniture-interactions.js site/src/
          cp src/object-definition-registry.js src/object-effect-engine.js src/object-legacy-adapter.js src/shop-catalog-selector.js site/src/
          cp src/object-use-runtime.js src/object-quality-presentation.js src/object-quality-comparison.js site/src/
          cp src/object-once-ledger.js site/src/
          cp src/kitchen.js src/hobby-content.js site/src/
          cp src/activity-session.js site/src/
          cp src/activity-registry.js site/src/
          cp src/painting.js site/src/
          cp src/painting-gallery.js site/src/
          cp src/painting-visual.js src/meshy-painting-runtime.js site/src/
          cp src/hobby-reading.js site/src/
          cp src/music-audio.js site/src/
          cp src/music-listening.js site/src/
          cp src/paired-hobby.js site/src/
          cp src/music-movement.js src/meshy-music-runtime.js site/src/
          cp src/reading-journey.js site/src/
          cp src/skills-engine.js site/src/
          cp src/skill-registry.js site/src/
          cp src/skill-presentation.js site/src/
          cp src/tv-interaction.js site/src/
          cp src/tv-seating.js site/src/
          cp src/tv-together.js site/src/
          cp src/furniture-placement-preview.js site/src/
          cp src/career-catalog.js src/career-scheduler.js src/career-state.js src/career-job-board.js src/career-phone-ui.js site/src/
          cp src/career-work.js src/career-progression.js src/career-recruitment.js site/src/
          cp src/calendar-core.js src/calendar-events.js src/calendar-holidays.js src/calendar-reminders.js src/calendar-ui.js site/src/
          cp src/day-night-cycle.js src/day-night-render.js site/src/
          cp src/game.js src/simulation.js src/navigation.js src/psychology.js src/trait-catalog.js src/sim-events.js src/emotion-engine.js src/mood-presentation.js src/social-perspective.js src/social-graph.js src/action-queue.js src/conversation-engine.js src/dialogue-decision.js src/world-interactions.js src/gifts-leisure.js src/household.js src/relationships.js src/social-reactions.js src/social-feedback.js src/social-episodes.js src/social-compatibility.js src/social-boundaries.js src/social-dynamics.js src/romance.js src/reaction-badges.js src/characters.js src/animations.js src/pose-config.js src/sofa-transition.js src/camera-controls.js src/locomotion.js src/bed-layout.js src/bed-transition.js src/fridge-interaction.js src/shower-interaction.js src/privacy-mosaic.js src/character-lab.js src/character-lab-config.js src/meshy-visual.js src/meshy-visual-policy.js src/meshy-sofa-pose.js src/interaction-anchors.js src/meshy-seat-runtime.js src/meshy-fridge-runtime.js src/meshy-bed-runtime.js src/meshy-shower-runtime.js src/loading-progress.js src/model-cache.js src/meshy-mira-visual.js src/meshy-mira-sofa.js src/meshy-mira-bed.js src/meshy-mira-policy.js site/src/
          cp src/mood-action-policy.js site/src/
          cp src/social-need.js site/src/
          cp src/meshy-reading-runtime.js site/src/
          cp src/romantic-hug.js src/meshy-hug-runtime.js src/romantic-kiss.js src/meshy-kiss-runtime.js site/src/
          cp src/romantic-intimacy.js site/src/
          cp src/romantic-evening-scene.js site/src/
          cp src/romantic-evening-stage.js site/src/
          cp src/romantic-sofa-stage.js site/src/
          cp src/toilet-interaction.js site/src/
          cp src/need-balance.js site/src/
          cp src/environment-effects.js site/src/
          cp src/meshy-toilet-pose.js site/src/
      - name: Include optional Meshy character GLB when present
        run: |
          mkdir -p site/assets/characters
          cp assets/characters/meshy-casual-v1.glb assets/characters/meshy-mira-mobile-v1.glb site/assets/characters/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      # GitHub's upload API can report success before Pages registers the artifact.
      - name: Let Pages artifact metadata propagate
        run: sleep 20
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
