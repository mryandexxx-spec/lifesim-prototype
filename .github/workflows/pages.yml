name: Test and deploy LifeSim to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check game rules and browser source syntax
        run: |
          npm ci
          npm test
          node --check src/game.js
          node --check src/simulation.js
          node --check src/navigation.js
          node --check src/psychology.js
          node --check src/household.js
          node --check src/relationships.js
          node --check src/characters.js
          node --check src/animations.js
          node --check src/pose-config.js
          node --check src/sofa-transition.js
          node --check src/camera-controls.js
          node --check src/locomotion.js
          node --check src/bed-layout.js
          node --check src/bed-transition.js
      - name: Assemble static website
        run: |
          mkdir -p site/src
          cp index.html styles.css favicon.svg manifest.webmanifest .nojekyll site/
          cp src/game.js src/simulation.js src/navigation.js src/psychology.js src/household.js src/relationships.js src/characters.js src/animations.js src/pose-config.js src/sofa-transition.js src/camera-controls.js src/locomotion.js src/bed-layout.js src/bed-transition.js src/fridge-interaction.js src/shower-interaction.js site/src/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
