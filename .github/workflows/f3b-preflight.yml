name: F3b TV seat preflight
on:
  push:
    branches: [feature/f3b-sofa-tv-20261116]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tv-seat-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check src/tv-seating.js && node --check src/tv-interaction.js && node --check src/game.js
