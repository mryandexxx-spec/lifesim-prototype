name: Meshy room 15 GLB — mobile WebGL and asset fitting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  furniture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install game dependencies and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify all source GLBs, dimensions, v1 compatibility and syntax
        run: |
          node --check src/game.js
          node --check src/meshy-furniture-policy.js
          node --check src/meshy-furniture-visual.js
          node --check tests/meshy-room-browser-smoke.mjs
          node --test tests/meshy-room-integration.test.js
          npm test
      - name: Start static PlayCanvas and smoke 15 actual models
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/meshy-room.log 2>&1 &
          sleep 3
          node tests/meshy-room-browser-smoke.mjs
      - name: Save WebGL screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meshy-room-15-products-mobile-webgl
          path: meshy-room-artifacts/
          if-no-files-found: ignore
