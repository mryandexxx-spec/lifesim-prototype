name: H5a Safe Painting WebGL Regression
on:
  push:
    branches:
      - feature/h5a-safe-painting-20261117
      - feature/h5c-painting-mastery-20261117
  pull_request:
    paths:
      - 'src/painting.js'
      - 'src/game.js'
      - 'tests/h5a-browser-smoke.mjs'
      - '.github/workflows/h5a-safe-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Serve the exact production ES module graph
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/blins-h5a-http.log 2>&1 &
      - name: Reproduce actual completion in a real WebGL browser
        run: node tests/h5a-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h5a-browser-screenshot
          path: h5a-browser-canvas.png
          retention-days: 7
