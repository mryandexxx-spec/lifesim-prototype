name: Mood M2 — branch-only validation (never deploy)
on:
  push:
    branches:
      - feature/mood-m2-20261115
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test M2 and all existing gameplay / dialogue / queue regressions
        run: |
          npm ci
          npm test
          node --check src/game.js
          node --check src/simulation.js
          node --check src/mood-action-policy.js
          node --check src/action-queue.js
          node --check src/gifts-leisure.js
      - name: Validate two unchanged optimized 3D resident models
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
