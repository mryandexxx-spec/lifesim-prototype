name: LOT-C2c — garden mobile WebGL, touch choices and regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c2c-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencies and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Syntax, all regression and 30-day simulation
        run: |
          node --check src/garden-presentation.js
          node --check src/game.js
          node --check tests/lot-c2c-browser-smoke.mjs
          node --test tests/lot-c1.test.js tests/lot-c2a-autonomy.test.js tests/lot-c2b-psychology.test.js tests/lot-c2c-mobile.test.js
          npm test
      - name: Four real mobile PlayCanvas WebGL viewports
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-c2c-http.log 2>&1 &
          sleep 3
          node tests/lot-c2c-browser-smoke.mjs
      - name: Retain real WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-c2c-mobile-webgl
          path: lot-c2c-*.png
          if-no-files-found: ignore
