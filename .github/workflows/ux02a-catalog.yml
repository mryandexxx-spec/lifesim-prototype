name: UX-02a — one-tap catalog and sticky mobile purchase WebGL
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux02a:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PlayCanvas and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Full Node suite, static contracts and source syntax
        run: |
          node --check src/game.js
          node --check tests/ux02a-browser-smoke.mjs
          npm test
      - name: Genuine PlayCanvas four-size touch and purchase test
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux02a.log 2>&1 &
          sleep 3
          node tests/ux02a-browser-smoke.mjs
      - name: Save screenshots and DOM bounds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux02a-four-size-catalog-preview-purchase
          path: ux02a-artifacts/
          if-no-files-found: ignore
