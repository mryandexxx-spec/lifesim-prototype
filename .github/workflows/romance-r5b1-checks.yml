name: R5b.1 real two-person table rendezvous
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full regression and module syntax
        run: |
          npm ci
          npm test
          for f in src/game.js src/romantic-evening-stage.js src/romantic-evening-scene.js src/relationships.js src/animations.js src/tv-seating.js; do node --check "$f"; done
      - name: Original Meshy model hashes
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
