name: Comfort C3 — mounted lights and mobile PlayCanvas QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mounted-lighting:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and real Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: C3 pure/save/compatibility tests and complete regression suite
        run: |
          node --check src/mounted-lighting.js
          node --check src/game.js
          node --check tests/comfort-c3-browser-smoke.mjs
          node --test tests/comfort-c3-mounted-lighting.test.js
          npm test
      - name: Mobile 390x844 and landscape PlayCanvas/WebGL
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/comfort-c3.log 2>&1 &
          sleep 3
          node tests/comfort-c3-browser-smoke.mjs
      - name: Save actual mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comfort-c3-mounted-webgl-screens
          path: comfort-c3-mounted-*.png
          if-no-files-found: ignore
