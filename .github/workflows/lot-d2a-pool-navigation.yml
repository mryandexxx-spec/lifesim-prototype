name: LOT-D2a — aquatic navigation, slots and four mobile WebGL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pool-d2a:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked engine and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Pure aquatic planning and complete project regression
        run: |
          node --check src/pool-navigation.js
          node --check src/action-queue.js
          node --check tests/lot-d2a.test.js
          node --test tests/lot-d2a.test.js tests/lot-d1a.test.js tests/lot-d1b.test.js tests/lot-d1c.test.js
          npm test
      - name: Genuine PlayCanvas/WebGL four iPhone-size pool regression
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-d2a-webgl.log 2>&1 &
          sleep 3
          node tests/lot-d1c-browser-smoke.mjs
