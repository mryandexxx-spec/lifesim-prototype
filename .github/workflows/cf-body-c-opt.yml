name: CF-BODY C exact repack diagnostic
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  actions: read
concurrency:
  group: cf-body-c-opt-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  exact-repack:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'art/cf-body-c-opt' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: cf-body-c-continuous-evidence
          run-id: 45634752787
          github-token: ${{ github.token }}
          path: reviewed
      - name: Install CPU-only browser and numeric dependencies
        run: |
          python -m pip install numpy==2.2.6 pillow==11.2.1 playwright==1.52.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify pinned accepted GLBs and repack exact arrays
        run: |
          mkdir -p opt-out
          python art-review/cf-body-c-opt/repack.py reviewed/lab opt-out/models
          mkdir -p served
          cp -a reviewed/lab served/reference
          cp -a reviewed/lab served/candidate
          cp opt-out/models/*.glb served/candidate/
      - name: Fixed framebuffer experiment (isolated lab copies)
        run: |
          cat > /tmp/fixed-buffer.py <<'PY'
          import pathlib
          for d in pathlib.Path('served').iterdir():
              p=d/'lab.js'
              if not p.is_file(): continue
              s=p.read_text()
              old='app=new pc.Application(canvas,{graphicsDeviceOptions:{antialias:true'
              assert old in s
              s=s.replace(old,'canvas.width=Math.max(1,canvas.clientWidth);canvas.height=Math.max(1,canvas.clientHeight);app=new pc.Application(canvas,{graphicsDeviceOptions:{antialias:false',1)
              a='app.setCanvasResolution(pc.RESOLUTION_AUTO);const resize=()=>app.resizeCanvas(Math.max(1,canvas.clientWidth),Math.max(1,canvas.clientHeight));new ResizeObserver(resize).observe(canvas.parentElement);resize();'
              b='app.setCanvasResolution(pc.RESOLUTION_FIXED,canvas.width,canvas.height);const resize=()=>{const w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);if(canvas.width!==w||canvas.height!==h)app.setCanvasResolution(pc.RESOLUTION_FIXED,w,h);app.renderNextFrame=true};window.addEventListener("resize",resize);window.postRenderFrame=()=>new Promise(resolve=>{app.once("postrender",()=>{const gl=app.graphicsDevice.gl;resolve({lost:gl.isContextLost(),error:gl.getError(),width:gl.drawingBufferWidth,height:gl.drawingBufferHeight})});app.renderNextFrame=true});'
              assert a in s
              p.write_text(s.replace(a,b,1))
          PY
          python /tmp/fixed-buffer.py
      - name: Actual A/B Chromium and WebKit renders
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python -m http.server 8765 --directory served >opt-out/server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/reference/index.html >/dev/null && break; sleep 1; done
          xvfb-run -a python art-review/cf-body-c-opt/browser.py
      - name: Bake selected profiles with original face morphs
        run: python art-review/cf-body-c-opt/bake.py
      - name: Apply fixed framebuffer to newly baked copies
        run: |
          cp reviewed/lab/lab.js served/reference/lab.js
          cp reviewed/lab/lab.js served/candidate/lab.js
          python /tmp/fixed-buffer.py
      - name: Actual fixed-body A/B render and expression checks
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          python -m http.server 8765 --directory served >opt-out/baked-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/reference/index.html >/dev/null && break; sleep 1; done
          xvfb-run -a python art-review/cf-body-c-opt/baked_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-body-c-opt-evidence
          path: opt-out/
          retention-days: 90
          if-no-files-found: warn

  native-rest:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'art/cf-body-c-opt' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 265a6f079b8c56f4b7722c3aa1dce98745d0dceb
          path: pinned-vis
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native CPU rig
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'anny @ git+https://github.com/naver/anny.git@8f35dc2df1c4062fd2fae86734f9705de50c0c2b' numpy==2.2.6
      - name: Verify source and compute 162 native rest joint samples
        run: |
          echo '4ce29a6ffce21817f92bb2c7df8c27afe630d0dd88e373a05e2ceca591fdcbb8  pinned-vis/male-candidate.glb' | sha256sum -c
          echo 'f4973254fb39f2ff962f429725e66c17a478d7e4110ed556679babb400c7d85e  pinned-vis/female-candidate.glb' | sha256sum -c
          python art-review/cf-body-c-opt/rig_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-body-c-native-rest
          path: rig-out/
          retention-days: 90
          if-no-files-found: warn
