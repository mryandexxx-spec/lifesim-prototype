name: W4-A — unified finance ledger and mobile WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finance-mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and actual Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Full Node suite plus finance and browser syntax
        run: |
          node --check src/finance-ledger.js
          node --check src/career-work.js
          node --check src/game.js
          node --check tests/w4a-finance-browser-smoke.mjs
          node --test tests/w4a-finance.test.js
          npm test
      - name: Real PlayCanvas and iPhone-sized touch financial operation
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w4a-finance.log 2>&1 &
          sleep 3
          node tests/w4a-finance-browser-smoke.mjs
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4a-finance-webgl-screens
          path: w4a-finance-*.png
          if-no-files-found: ignore
