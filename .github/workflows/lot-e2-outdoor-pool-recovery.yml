name: LOT-E2 — corrupted outdoor payload cannot destroy paid pool or exit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outdoor-pool-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned PlayCanvas dependency for full Node regression
        run: npm ci
      - name: Verify root-v1 restoration syntax and targeted fault injection
        run: |
          node --check src/lot-surface.js
          node --check tests/lot-e2-overlap-recovery.test.js
          node --test tests/lot-e2-overlap-recovery.test.js
      - name: Check every pure regression without changing save schema
        run: npm test
