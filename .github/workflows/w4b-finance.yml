name: W4-B — phone finance analytics and four-screen mobile WebGL
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phone-finance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime and real Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Pure date/ledger/view tests and all regression tests
        run: |
          node --check src/finance-presentation.js
          node --check src/finance-phone-ui.js
          node --check src/career-phone-ui.js
          node --check src/game.js
          node --check tests/w4b-finance-browser-smoke.mjs
          node --test tests/w4b-finance.test.js
          npm test
      - name: Real PlayCanvas touch, charts and old saves at 4 iPhone viewports
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w4b-finance.log 2>&1 &
          sleep 3
          node tests/w4b-finance-browser-smoke.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4b-finance-mobile-webgl-screens
          path: w4b-finance-*.png
          if-no-files-found: ignore
