name: CF-SKIN BASE isolated UV gate
on:
  pull_request:
    paths:
      - 'art-review/cf-skin-base/**'
      - '.github/workflows/cf-skin-base.yml'
permissions:
  contents: read
concurrency:
  group: cf-skin-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  uv-gate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'art/cf-skin-base'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      CUDA_VISIBLE_DEVICES: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 265a6f079b8c56f4b7722c3aa1dce98745d0dceb
          path: pinned-vis
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned native CPU toolchain
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'anny @ git+https://github.com/naver/anny.git@8f35dc2df1c4062fd2fae86734f9705de50c0c2b' bpy==4.5.0 scipy==1.15.3 pillow==11.3.0
          python -c 'import bpy,torch; assert bpy.app.version==(4,5,0); assert torch.version.cuda is None'
      - name: Verify exact UV correspondence, all target fields and real checker renders
        run: python art-review/cf-skin-base/uv_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-skin-base-uv-evidence
          path: skin-out/
          if-no-files-found: warn
          retention-days: 90
