name: GQ-04 comparative and long session evidence
on:
  workflow_dispatch:
    inputs:
      full:
        description: Run original 30 and 120 minute sessions instead of short diagnostic
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      full:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  strategy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing technical integration and evidence negative controls
        run: node --test tests/life-integration-qa.test.js tests/gq-playtest-evidence.test.js
      - name: Six policy probes on identical initial save
        env:
          GQ_EXPECTED_SHA: ${{ inputs.ref || github.sha }}
        run: node tests/gq-strategy-probe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gq-strategy-evidence
          path: artifacts/gq-strategy/
          if-no-files-found: error
  long:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full && '[{"engine":"chromium","minutes":30},{"engine":"webkit","minutes":120}]' || '[{"engine":"chromium","minutes":5}]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real touch and observed outcomes
        env:
          GQ_EXPECTED_SHA: ${{ inputs.ref || github.sha }}
          GQ_ENGINE: ${{ matrix.engine }}
          GQ_MINUTES: ${{ matrix.minutes }}
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps "$GQ_ENGINE"
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/gq-long-http.log 2>&1 &
          sleep 3
          node tests/gq-long-session.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gq-long-${{ matrix.engine }}-${{ matrix.minutes }}
          path: artifacts/gq-long/
          if-no-files-found: error
