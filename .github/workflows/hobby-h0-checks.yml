name: H0 hobby and skills headless regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: H0 source syntax and complete regression
        run: |
          node --check src/activity-registry.js
          node --check src/activity-session.js
          node --check src/skill-registry.js
          node --check src/skills-engine.js
          node --check src/hobby-content.js
          npm test
      - name: Keep original Meshy GLBs intact
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
