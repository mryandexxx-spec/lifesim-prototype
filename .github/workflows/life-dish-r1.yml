name: LIFE DISH-R1 — canonical dirty plates and four mobile WebGL viewports
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dish-r1:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate kitchen count, physical wash, regression and all Node tests
        run: |
          npm ci
          node --check src/dirty-dishes-visual.js
          node --check src/household.js
          node --check src/game.js
          node --check tests/life-dish-r1-browser-smoke.mjs
          node --test tests/life-dish-r1.test.js
          npm test
      - name: Install mobile Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Four touch viewports with real PlayCanvas WebGL and sink workflow
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dish-r1-http.log 2>&1 &
          sleep 3
          node tests/life-dish-r1-browser-smoke.mjs
