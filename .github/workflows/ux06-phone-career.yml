name: UX-06 — contextual phone and career
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux06:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Node suite and syntax
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node --check src/game.js
          node --check src/career-phone-ui.js
          node --check src/ux06-phone-state.js
          node --check tests/ux06-browser-smoke.mjs
          npm test
      - name: Real PlayCanvas WebGL 4-viewport phone and incidents
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux06.log 2>&1 &
          sleep 3
          node tests/ux06-browser-smoke.mjs
      - name: Keep viewport screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux06-phone-four-viewports
          path: ux06-artifacts/
          if-no-files-found: ignore
