name: CF-ANIM runtime pilot (CC0)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  actions: read
concurrency:
  group: cf-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  runtime:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'diagnostic/cf-anim-runtime-pilot'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9a4d8adaccbf55572346904750e252565d30d924
          path: prior-code
          persist-credentials: false
      - name: Fetch and verify the two already published exact artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15156888585/zip" -o r8.zip
          echo '57394ee22963252f23e8934a561e5b50f04752647b2ced58dbb2f9dc692363b7  r8.zip' | sha256sum -c
          unzip -q r8.zip -d input-r8
          curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/15054212377/zip" -o rig.zip
          echo '1e7ba4518b8efefc86206c7f02471e7230f0bf94c78d0831b5244d552380fead  rig.zip' | sha256sum -c
          unzip -q rig.zip -d prior-full
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact native and runtime dependencies
        run: |
          python -m pip install --only-binary=:all: bpy==4.5.0 numpy==1.26.4 imageio-ffmpeg==0.6.0 playwright==1.57.0 Pillow==11.3.0
          npm ci
          python -m playwright install --with-deps chromium webkit
          python -m py_compile tools/cf_runtime_bake.py tools/cf_runtime_browser.py
      - name: Bake immutable R8 poses and independently reimport
        run: |
          timeout 240s python -u tools/cf_runtime_bake.py
          cp tools/cf_runtime_lab.html runtime-lab/lab.html
          cp node_modules/playcanvas/build/playcanvas.mjs runtime-lab/playcanvas.mjs
      - name: Browser render and real-time start-stop playback
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory runtime-lab > /tmp/runtime-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          set +e
          xvfb-run -a python -u tools/cf_runtime_browser.py chromium
          chromium=$?
          xvfb-run -a python -u tools/cf_runtime_browser.py webkit
          webkit=$?
          set -e
          test "$chromium" = 0 && test "$webkit" = 0
      - name: Strict native floor/contact gates
        if: always()
        run: |
          python -c 'import json; d=json.load(open("runtime-lab/manifest.json"))["dense"]; print(d); assert d["contactSamples"]>0 and d["floorFailures"]==d["contactFailures"]==0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cf-anim-runtime-pilot-evidence
          path: |
            runtime-lab/bake.json
            runtime-lab/manifest.json
            runtime-lab/native-report.json
            runtime-lab/evidence/
          if-no-files-found: warn
