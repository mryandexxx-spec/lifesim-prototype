name: Hug arms visual runtime regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          npm ci
          npm test
          node --check src/meshy-hug-runtime.js
          node --check src/game.js
