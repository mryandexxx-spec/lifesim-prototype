name: CAS-HEAD-V2-P2 experimental Blender art (isolated)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cas-head-v2-p2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-blender:
    name: Source-pinned bpy 4.5 morph/rig + independent mobile lab
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: Check read-only source originals, lab UX and negative art acceptance
        run: |
          node --test tests/cas-head-v2-p2-lab.test.js
          sha256sum assets/characters/meshy-casual-v1.glb assets/characters/meshy-mira-mobile-v1.glb
      - name: Install Linux headless Blender requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-6 libxi6 libxxf86vm1 libxrender1 libxfixes3 libxkbcommon0 libgl1 libegl1 libsm6 libxext6 libxcb1 libxrandr2 libxinerama1 libxcursor1 libfontconfig1 libfreetype6 libopenal1
      - name: Obtain exact official CC0 MPFB v2.0.18 donor, no addon vendored
        run: |
          git clone --depth=1 --branch v2.0.18 https://github.com/makehumancommunity/mpfb2.git "$RUNNER_TEMP/mpfb2"
          test "$(git -C "$RUNNER_TEMP/mpfb2" rev-parse HEAD)" = "d0a32e57a7f915cb2f2b95410e2117648c7bbb7e"
          test "$(sha256sum "$RUNNER_TEMP/mpfb2/src/mpfb/data/3dobjs/base.obj" | cut -d' ' -f1)" = "8e761e6624b8f54536409135d1636da63b32486a90d4897f84e121d144f6fb4c"
          sudo mkdir -p /vercel
          sudo ln -s "$GITHUB_WORKSPACE" /vercel/sandbox
          sudo ln -s "$RUNNER_TEMP/mpfb2" /vercel/mpfb2
          sudo install -d -o "$(id -un)" -g "$(id -gn)" /vercel/p2-output
      - name: Build two genuine skinned Blender WIP exports and reference renders
        run: |
          uv run --python 3.11 --with bpy==4.5.0 --with pillow python art-review/cas-head-v2/blender-p2-derivative-wip.py
          test -s /vercel/p2-output/alex-derivative-wip.blend
          test -s /vercel/p2-output/mira-derivative-wip.blend
      - name: Densify legal glTF sparse morphs and pass strict P1 structural validator
        run: |
          python3 art-review/cas-head-v2/expand-sparse-p2.py /vercel/p2-output/alex-derivative-wip.glb /vercel/p2-output/mira-derivative-wip.glb
          node art-review/cas-head-v2/verify-derived-heads.mjs /vercel/p2-output/alex-derivative-dense.glb /vercel/p2-output/mira-derivative-dense.glb | tee /vercel/p2-output/p2-structural-receipt.json
          mkdir -p art-review/cas-head-v2/p2-lab/assets
          cp /vercel/p2-output/alex-derivative-dense.glb art-review/cas-head-v2/p2-lab/assets/
          cp /vercel/p2-output/mira-derivative-dense.glb art-review/cas-head-v2/p2-lab/assets/
      - name: Record art-rejected status (never production-ready)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/vercel/p2-output/p2-structural-receipt.json')
          result=json.loads(p.read_text())
          assert len(result)==2
          for r in result:
              assert r['geometryAndRigInspection']=='PASS'
              assert not r['ownerArtApproved'] and not r['productionReady']
              assert not r['uvAndFaceArtApproved'] and not r['playcanvasWebGLVerified']
          print('P2_STRUCTURAL_PASS_BUT_ART_REJECTED', [r['family'] for r in result])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: CAS-HEAD-V2-P2-rejected-Blender-WIP-not-game-assets
          if-no-files-found: error
          retention-days: 14
          path: |
            /vercel/p2-output/*.blend
            /vercel/p2-output/*-derivative-dense.glb
            /vercel/p2-output/*-neutral.png
            /vercel/p2-output/*-max5.png
            /vercel/p2-output/*-head-skin.png
            /vercel/p2-output/p2-structural-receipt.json
