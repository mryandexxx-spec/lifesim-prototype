name: LIFE NEEDS-R1 — quantitative household baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  needs-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check read-only reporter and all need/household compatibility tests
        run: |
          npm ci
          node --check scripts/q3a-diagnostics.mjs
          node --check scripts/life-needs-r1-report.mjs
          node --test tests/needs-balance.test.js
          npm test
      - name: Measure 24h, 7d and 30d, two residents, work, autonomy and reload
        run: |
          mkdir -p life-needs-r1-artifacts
          node scripts/q3a-diagnostics.mjs > life-needs-r1-artifacts/raw.log
          node scripts/life-needs-r1-report.mjs life-needs-r1-artifacts/raw.log
          git diff --exit-code -- src/
      - name: Preserve observed values and audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: life-needs-r1-baseline
          path: life-needs-r1-artifacts/
          if-no-files-found: ignore
