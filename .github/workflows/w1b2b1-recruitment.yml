name: W1-B.2b recruitment all-career iPhone-size PlayCanvas QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recruitment-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare PlayCanvas and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate saved recruitment and mobile WebGL flow
        run: |
          node --check src/career-recruitment.js
          node --check src/career-interview-content.js
          node --check src/career-phone-ui.js
          node --check src/household.js
          node --check src/game.js
          node --test tests/w1b2b1-recruitment.test.js tests/w1b2b2-recruitment.test.js
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w1b2b1-http.log 2>&1 &
          sleep 2
          node tests/w1b2b1-browser-smoke.mjs
          node tests/w1b2b2-browser-smoke.mjs
      - name: Save browser snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1b2b-all-interviews-iphone-screenshots
          path: |
            w1b2b1-*-iphone.png
            w1b2b2-*-iphone.png
          if-no-files-found: ignore
