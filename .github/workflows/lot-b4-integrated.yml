name: LOT-B4 — integrated lot and mobile regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lot-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node and Chromium WebGL
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Check lot code, integrated contract and full Node regression
        run: |
          node --check src/game.js
          node --check src/outdoor-proposals.js
          node --check src/navigation.js
          node --check src/household.js
          node --check tests/lot-b4-integrated.test.js
          node --check tests/lot-b4-browser-smoke.mjs
          node --test tests/lot-b4-integrated.test.js
          npm test
      - name: Real PlayCanvas WebGL mobile multi-system smoke
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-b4-http.log 2>&1 &
          sleep 3
          node tests/lot-b4-browser-smoke.mjs
      - name: Retain 4 mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-b4-mobile-webgl
          path: lot-b4-*.png
          if-no-files-found: ignore
