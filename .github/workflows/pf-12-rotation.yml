name: PF-12 outdoor rotation preview
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Targeted outdoor and editor regression
        run: node --test tests/pf-12-outdoor-rotation.test.js tests/of-integration-b.test.js tests/of-integration-c.test.js tests/of-integration-d.test.js tests/lot-b3.test.js tests/lot-c1.test.js tests/furniture-shop-integration.test.js
      - name: Real mobile Chromium and WebKit touch
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-12-http.log 2>&1 &
          sleep 3
          node tests/pf-12-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-12-evidence
          path: artifacts/pf-12/
          if-no-files-found: warn
