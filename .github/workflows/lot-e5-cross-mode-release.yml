name: LOT-E5 — cross-mode release QA (manual deep verification)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-mode-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pinned npm dependencies and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: LOT-E5 contract and syntax checks
        run: |
          node --check tests/lot-e5-browser-smoke.mjs
          node --test tests/lot-e5-cross-mode.test.js
      - name: Four real PlayCanvas WebGL mobile viewports and editor transitions
        run: |
          mkdir -p vendor artifacts/lot-e5
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-e5-webgl.log 2>&1 &
          sleep 3
          node tests/lot-e5-browser-smoke.mjs
      - name: Upload mode and reload screenshots plus JSON release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-e5-cross-mode-report
          path: artifacts/lot-e5/
          if-no-files-found: ignore
