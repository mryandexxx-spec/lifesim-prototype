name: PF-15 real household speed
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-speed:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test tests/pf-15-household-speed.test.js tests/q3b-life-balance.test.js tests/qsk-11-time-ui.test.js
      - name: Mobile touch and live sleep/work transitions
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pf-15-http.log 2>&1 &
          sleep 3
          node tests/pf-15-browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pf-15-speed-evidence
          path: artifacts/pf-15/
          if-no-files-found: warn
