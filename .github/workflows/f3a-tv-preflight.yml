name: F3a TV watch preflight
on:
  push:
    branches: [feature/f3a-tv-watch-20261116]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check src/tv-interaction.js && node --check src/furniture-shop.js && node --check src/game.js
