name: Toilet M4 authored sit and stand — branch only
on:
  push:
    branches: [feature/toilet-m4-animations-20261116]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All game regressions and animation logic
        run: |
          npm ci
          npm test
          node --check src/meshy-toilet-pose.js
          node --check src/meshy-visual.js
          node --check src/meshy-mira-visual.js
          node --check src/game.js
      - name: Original assets unchanged
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
