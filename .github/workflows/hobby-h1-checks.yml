name: H1 physical reading and skill integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: H1 syntax, physical reading, entire regression
        run: |
          node --check src/hobby-reading.js
          node --check src/game.js
          node --check src/household.js
          node --check src/simulation.js
          node --check src/action-queue.js
          npm test
      - name: Verify unchanged two original Meshy assets
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
