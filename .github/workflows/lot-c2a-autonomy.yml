name: LOT-C2a — autonomous garden safety and 7-day regression
on:
  pull_request:
    paths:
      - 'src/garden-autonomy.js'
      - 'src/household.js'
      - 'src/game.js'
      - 'src/gardening.js'
      - 'tests/lot-c2a-autonomy.test.js'
      - 'index.html'
      - '.github/workflows/pages.yml'
      - '.github/workflows/lot-c2a-autonomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c2a-unit-and-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and integration safety
        run: |
          node --check src/garden-autonomy.js
          node --check src/household.js
          node --check src/game.js
          node --check tests/lot-c2a-autonomy.test.js
      - name: Approved C2a 7-day, FIFO, work, sleep and save contract
        run: node --test tests/lot-c2a-autonomy.test.js
      - name: All existing LifeSim regressions
        run: npm test
