name: UX-08 — calendar and safe game menu
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ux08:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Node regression and syntax
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node --check src/calendar-ui.js
          node --check src/game.js
          node --check src/ui-onboarding.js
          node --check tests/ux08-calendar-menu.test.js
          node --check tests/ux08-browser-smoke.mjs
          npm test
      - name: Four genuine PlayCanvas/WebGL iPhone screens
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ux08.log 2>&1 &
          sleep 3
          node tests/ux08-browser-smoke.mjs
      - name: Preserve four mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux08-calendar-menu-four-viewports
          path: ux08-artifacts/
          if-no-files-found: ignore
