name: R3 romance boundaries and jealousy safety preflight
on:
  push:
    branches: [feature/r3-integrate-over-f3-20261116]
  pull_request:
    paths:
      - 'src/romance.js'
      - 'src/social-graph.js'
      - 'src/game.js'
      - 'tests/romance-r3.test.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Full regression tests and module syntax
        run: |
          npm ci
          npm test
          for f in src/game.js src/romance.js src/relationships.js src/social-graph.js src/romantic-intimacy.js; do node --check "$f"; done
      - name: Verify original Meshy model hashes
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
