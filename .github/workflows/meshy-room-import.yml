name: Import optimized Meshy room assets (staging)
on:
  push:
    branches: [assets/meshy-room-batch-01-20261120]
    paths: [.github/workflows/meshy-room-import.yml]
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify every optimized GLB sequentially
        env:
          ASSET_ENDPOINT: https://sb-256vptukjm30.vercel.run
        run: |
          python3 - <<'PY'
          import hashlib,json,time,urllib.request,pathlib,os
          data=json.loads(pathlib.Path('assets/furniture/meshy-room-v1/manifest.json').read_text())
          assert len(data['items'])==15
          for i,item in enumerate(data['items'],1):
              path=pathlib.Path(item['file'])
              path.parent.mkdir(parents=True,exist_ok=True)
              url=os.environ['ASSET_ENDPOINT'].rstrip('/')+'/'+path.name
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(url,headers={'User-Agent':'LifeSim-asset-stager/1.0'})
                      with urllib.request.urlopen(request,timeout=35) as response: raw=response.read()
                      break
                  except Exception:
                      if attempt==3: raise
                      time.sleep(3*(attempt+1))
              assert len(raw)==item['bytes'],f"{path.name}: size mismatch"
              assert hashlib.sha256(raw).hexdigest()==item['sha256'],f"{path.name}: sha256 mismatch"
              assert raw[:4]==b'glTF',f"{path.name}: not GLB"
              path.write_bytes(raw)
              print(f"{i}/15 {path.name}: {len(raw)} bytes, SHA256 PASS")
          PY
      - name: Commit verified staging models to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/furniture/meshy-room-v1/*.glb
          git diff --cached --check
          git commit -m "assets(meshy): stage 15 optimized and checksum-verified room models"
          git push origin HEAD:assets/meshy-room-batch-01-20261120
