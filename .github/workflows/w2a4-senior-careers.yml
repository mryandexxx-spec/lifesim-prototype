name: W2-A.4 full eight-rank branches — PlayCanvas mobile QA
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  senior-careers:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original runtime and mobile browser
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify senior job rules, all regressions and entire Node suite
        run: |
          node --check src/career-seniority.js
          node --check src/career-specializations.js
          node --check src/career-state.js
          node --check src/career-progression.js
          node --check src/career-incidents.js
          node --check src/career-phone-ui.js
          node --check tests/w2a4-browser-smoke.mjs
          node --test tests/w2a4-senior-careers.test.js tests/w2a3-career-specializations.test.js tests/w2a2-professional-goals.test.js tests/w2a1-career-ladders.test.js
          npm test
      - name: PlayCanvas/WebGL 390x844 real touch and reload
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/w2a4-http.log 2>&1 &
          sleep 2
          node tests/w2a4-browser-smoke.mjs
      - name: Upload mobile screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2a4-full-career-390x844
          path: w2a4-*-iphone.png
          if-no-files-found: ignore
