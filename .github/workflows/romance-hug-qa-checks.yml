name: R1a safe hug QA shortcut
on:
  push:
    branches: [feature/romance-hug-qa-shortcut-20261116]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all simulator regressions and validate Safari modules
        run: |
          npm ci
          npm test
          node --check src/game.js
          node --check src/romance-hug-qa.js
          node --check src/romantic-hug.js
          node --check src/relationships.js
      - name: Preserve both original skinned characters
        run: |
          echo "7014401e6819b8b047fe384cfce4a62549711aa711d26a6894571800a40eb5f4  assets/characters/meshy-casual-v1.glb" | sha256sum -c -
          echo "40a2d1e0dcde53f7c2f53c6bd220f39ba440bbf4d42dfbad949ca82146594d0a  assets/characters/meshy-mira-mobile-v1.glb" | sha256sum -c -
