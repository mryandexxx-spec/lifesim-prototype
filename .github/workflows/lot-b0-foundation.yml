name: LOT-B0 — outdoor schema, topology and mobile compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outdoor-domain:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Source, domain and full household regression
        run: |
          node --check src/outdoor-catalog.js
          node --check src/outdoor-proposals.js
          node --check src/lot-surface.js
          node --check src/household.js
          node --check src/navigation.js
          node --check src/game.js
          node --test tests/lot-b0.test.js
          npm test
      - name: Existing real mobile PlayCanvas WebGL regression
        run: |
          mkdir -p vendor
          cp node_modules/playcanvas/build/playcanvas.mjs vendor/playcanvas.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/lot-b0-http.log 2>&1 &
          sleep 3
          node tests/lot-a-browser-smoke.mjs
      - name: Upload regression captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-b0-mobile-webgl
          path: lot-a-*.png
          if-no-files-found: ignore
