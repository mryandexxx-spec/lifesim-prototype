<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Блин’С · OF-01</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#28382f;font:15px system-ui}main{max-width:860px;margin:auto;padding:14px}h1{font-size:23px;margin:0}p{line-height:1.35}select,button,a.link{font:inherit;min-height:44px;padding:9px 12px;border-radius:8px;border:1px solid #a3aba0;background:#fff;color:#28382f}a.link{display:inline-flex;align-items:center;text-decoration:none}select{max-width:100%}.controls{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0;background:#fff;border-radius:10px;overflow:hidden}img{display:block;width:100%;height:auto}figcaption{padding:8px;font-weight:600}.note{font-size:13px;color:#58635b}#donor{margin-top:8px;max-width:50%}footer{margin-top:12px;font-size:13px}</style></head><body><main><h1>Блин’С · OF-01</h1><p>Диагностическая лаборатория, не релиз. Сравнение реальных Blender-рендеров. WebKit 3D не прошёл проверку, физическая Safari QA и художественная приёмка ещё открыты.</p><div class="controls"><select id="sku" aria-label="Предмет"><option value="diningtable.farm">Стол «Ферма»</option><option value="floorlamp.arc">Торшер «Арка»</option><option value="tree.round">Круглое дерево</option><option value="sculpture.balance">Скульптура «Баланс»</option><option value="pool.ladder">Лестница бассейна</option></select><select id="angle" aria-label="Ракурс"><option value="three-quarter">3/4</option><option value="front">Анфас</option><option value="profile">Профиль</option></select><a class="link" href="3d.html">Открыть 3D (эксперимент)</a></div><div class="pair"><figure><img id="old" alt="Старый вид"><figcaption>Было</figcaption></figure><figure><img id="new" alt="Новая модель"><figcaption>Стало</figcaption></figure></div><figure id="donor"><img id="reference" alt="CC0 модель"><figcaption>CC0 · сравнение</figcaption></figure><p id="metrics" class="note"></p><footer>Доноры: Poly Haven и Kenney (CC0). <a href="donors/table/source.json">Стол</a> · <a href="donors/tree/source.json">Дерево</a> · <a href="donors/tree/license.txt">Лицензия</a>.</footer></main><script>const q=id=>document.getElementById(id),sku=q('sku'),angle=q('angle');let m={};function update(){let id=sku.value,a=angle.value;for(const v of ['old','new'])q(v).src='blender/'+id+'-'+v+'-'+a+'.png';let has=id==='diningtable.farm'||id==='tree.round';q('donor').hidden=!has;if(has)q('reference').src='blender/'+id+'-donor-'+a+'.png';let x=m[id]?.new;q('metrics').textContent=x?x.triangles+' треугольников · '+Math.round(x.bytes/1024)+' КиБ · '+x.materials+' материалов':''}sku.onchange=angle.onchange=update;update();fetch('manifest.json').then(r=>r.json()).then(x=>{m=x;update()})</script></body></html>
