<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17262b">
<title>Блин’С · CAS-HEAD-V2-P2 · Blender art review</title>
<style>
:root{color-scheme:dark;--ink:#f5f7f5;--muted:#b8c6c8;--bar:#17262bed;--accent:#80c8c0}
*{box-sizing:border-box}html,body{height:100%;height:100dvh;margin:0;overscroll-behavior:none}
body{font:14px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--ink);background:#26373a;display:flex;flex-direction:column}
#viewport{flex:1;min-height:190px;position:relative;overflow:hidden;background:linear-gradient(#647a79,#283a3c)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;z-index:3;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
.top strong,.top small{display:block;background:#122428e9;padding:8px 10px;border-radius:9px;max-width:66%;line-height:1.3}
.top small{color:#ffd9a0;text-align:right;font-weight:700}
#status{position:absolute;bottom:8px;left:10px;right:10px;z-index:3;font-size:12px;color:#eff8f5;text-shadow:0 1px 3px #071718;pointer-events:none}
#panel{flex:none;background:var(--bar);border-top:1px solid #8ba1a4;padding:8px 10px calc(8px + env(safe-area-inset-bottom));height:238px;overflow:auto}
#panel.collapsed{height:54px;overflow:hidden}
.head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.head span{font-size:12px;color:var(--muted)}
button,select{font:inherit;touch-action:manipulation;color:var(--ink);background:#2d4449;border:1px solid #67888b;border-radius:9px;min-height:44px;padding:6px 9px}
button[aria-pressed="true"]{background:#79b9b3;color:#14262b;border-color:#79b9b3;font-weight:700}
button:disabled{opacity:.4}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.controls .wide{grid-column:1 / -1}
.choice{display:flex;gap:5px}
.choice>*{flex:1;min-width:0}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}
.slider{display:grid;grid-template-columns:auto 1fr 31px;align-items:center;gap:6px;font-size:12px}
.slider output{text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;min-width:0;accent-color:#80c8c0}
#report{margin-top:8px;color:#f6d6a7;font-size:11px;line-height:1.4}
@media(max-width:340px){#panel{height:227px}.choice button,.choice select{font-size:12px;padding:4px}.sliders{gap:5px}.slider{gap:3px}.top strong{max-width:56%}}
</style>
</head>
<body>
<div id="viewport">
 <canvas id="review-canvas" aria-label="3D предпросмотр Blender-голов"></canvas>
 <div class="top"><strong>Блин’С · CAS HEAD V2 / P2</strong><small>WIP · ART НЕ ПРИНЯТ</small></div>
 <div id="status" role="status" aria-live="polite">Загрузка PlayCanvas…</div>
</div>
<section id="panel" aria-label="Панель лаборатории">
 <div class="head"><span>Отдельная лаборатория. Оригиналы не меняются.</span><button id="toggle" type="button" aria-expanded="true">Свернуть ⌄</button></div>
 <div class="controls">
  <div class="choice"><button data-family="alex" aria-pressed="true">Алекс</button><button data-family="mira" aria-pressed="false">Мира</button></div>
  <div class="choice"><button data-variant="original" aria-pressed="false">Оригинал</button><button data-variant="derived" aria-pressed="true">Новый WIP</button></div>
  <div class="choice wide"><button data-view="face" aria-pressed="true">Лицо</button><button data-view="body" aria-pressed="false">В полный рост</button><button id="rotate">Угол 0°</button></div>
  <div class="choice wide"><button data-pose="idle" aria-pressed="true">Покой</button><button data-pose="walking" aria-pressed="false">Ходьба</button><button data-pose="sit" aria-pressed="false">Сидит</button></div>
 </div>
 <div class="sliders" id="sliders">
  <label class="slider">Глаза <input data-morph="eyes" type="range" min="0" max="100" value="0"><output>0%</output></label>
  <label class="slider">Нос <input data-morph="nose" type="range" min="0" max="100" value="0"><output>0%</output></label>
  <label class="slider">Губы <input data-morph="lips" type="range" min="0" max="100" value="0"><output>0%</output></label>
  <label class="slider">Подбородок <input data-morph="chin" type="range" min="0" max="100" value="0"><output>0%</output></label>
  <label class="slider wide">Щёки <input data-morph="cheeks" type="range" min="0" max="100" value="0"><output>0%</output></label>
 </div>
 <div class="choice" style="margin-top:7px"><button id="min" class="wide">Все 0%</button><button id="max" class="wide">Все 100%</button></div>
 <div id="report">Технический Blender-прототип. Семантические петли, посадка глаз, шов шеи и художественный стиль пока не прошли контроль. Не интегрировано в игру.</div>
</section>
<script type="module" src="./app.js"></script>
</body>
</html>
