<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#242825">
  <title>LifeSim · Головы P3-09</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <h1>Головы P3-09</h1>
      <div class="segmented" aria-label="Семейство">
        <button type="button" data-family="alex" aria-pressed="true">Леон</button>
        <button type="button" data-family="mira" aria-pressed="false">Ася</button>
      </div>
    </header>
    <section id="viewport" aria-label="Трёхмерный просмотр">
      <canvas id="review-canvas"></canvas>
      <div class="scene-label" id="scene-label">Леон</div>
      <div class="scene-actions">
        <button type="button" id="rotate" aria-label="Повернуть на 45 градусов">Угол <span>0°</span></button>
        <button type="button" id="frame" aria-pressed="false">В полный рост</button>
      </div>
    </section>
    <section id="panel" aria-label="Управление просмотром">
      <div class="panel-top">
        <div class="segmented" aria-label="Вариант">
          <button type="button" data-variant="derived" aria-pressed="true">Новая модель</button>
          <button type="button" data-variant="original" aria-pressed="false">Оригинал</button>
        </div>
        <select id="pose" aria-label="Анимация">
          <option value="neutral">Нейтральная</option>
          <option value="idle">Ожидание</option>
          <option value="walk">Ходьба</option>
          <option value="sit">Сесть / встать</option>
        </select>
      </div>
      <div id="morphs" aria-label="Морфы лица">
        <label><span>Глаза</span><input data-morph="eyes" type="range" min="0" max="100" value="0"><output>0%</output></label>
        <label><span>Нос</span><input data-morph="nose" type="range" min="0" max="100" value="0"><output>0%</output></label>
        <label><span>Губы</span><input data-morph="lips" type="range" min="0" max="100" value="0"><output>0%</output></label>
        <label><span>Подбородок</span><input data-morph="chin" type="range" min="0" max="100" value="0"><output>0%</output></label>
        <label><span>Скулы</span><input data-morph="cheeks" type="range" min="0" max="100" value="0"><output>0%</output></label>
      </div>
      <div class="panel-bottom">
        <div class="segmented" aria-label="Все морфы">
          <button type="button" id="min">Все 0%</button>
          <button type="button" id="max">Все 100%</button>
        </div>
        <p id="status" role="status" aria-live="polite">Загрузка…</p>
      </div>
    </section>
  </main>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
